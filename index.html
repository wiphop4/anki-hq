m/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap');\n\n/* ===== โทนสี: White #FAFAFA + Teal + Coral ===== */\n:root {\n  --font-body: 'IBM Plex Sans Thai', -apple-system, \"Segoe UI\", sans-serif;\n  --font-ui:   'Sarabun', 'IBM Plex Sans Thai', sans-serif;\n  --font-math: 'Source Serif 4', 'Noto Serif', Georgia, serif;\n\n  --white:       #fafafa;\n  --bg:          var(--white);\n  --panel:       var(--white);\n  --solution-bg: var(--white);\n  --panel-line:  #dfe3e7;\n  --text-main:   #1e2a30;\n  --text-muted:  #6b7a85;\n  --accent:      #0f8b8d;\n  --accent-deep: #0b6e70;\n  --accent-soft: #e3f3f3;\n  --shadow:      0 1px 3px rgba(20,40,50,.08);\n\n  --alert-accent: #e4572e;\n  --alert-text:   #9a3412;\n  --alert-soft:   #fdeee8;\n\n  /* ขนาดตัวหนังสือปรับตามความกว้างจอ: 16px (แคบ) → 21px (กว้างมาก) */\n  --fs-base: clamp(16px, 1.1vw + 11px, 21px);\n}\n\n.nightMode {\n  --white:       #121416;\n  --bg:          #121416;\n  --panel:       #121416;\n  --solution-bg: #121416;\n  --panel-line:  #2c3236;\n  --text-main:   #e9eef0;\n  --text-muted:  #93a1a8;\n  --accent:      #3fc1c0;\n  --accent-deep: #7ddbd9;\n  --accent-soft: #163236;\n  --shadow:      0 1px 3px rgba(0,0,0,.4);\n\n  --alert-accent: #ff8a65;\n  --alert-text:   #ffc9b5;\n  --alert-soft:   #33201a;\n}\n\n/* ===== เต็มจอ ===== */\nhtml, body {\n  margin: 0;\n  padding: 0;\n  min-height: 100%;\n  background: var(--bg);\n}\n\n/* ===== พื้นฐาน ===== */\n.card {\n  font-family: var(--font-body);\n  font-size: var(--fs-base);\n  font-weight: 400;\n  line-height: 1.75;\n  letter-spacing: 0;\n  color: var(--text-main);\n  background: var(--bg);\n  min-height: 100vh;\n  box-sizing: border-box;\n  padding: 16px 18px 32px;\n  text-align: left;\n  -webkit-text-size-adjust: 100%;\n}\n\n/* เต็มความกว้างและความสูง ไม่จำกัดกรอบ */\n.main-container {\n  width: 100%;\n  max-width: none;\n  margin: 0;\n  min-height: calc(100vh - 48px);\n  display: flex;\n  flex-direction: column;\n}\n\n/* ===== หัวการ์ด ===== */\n.card-head {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  min-height: 30px;\n  margin-bottom: 10px;\n  flex: 0 0 auto;\n}\n\n.source-badge {\n  font-family: var(--font-ui);\n  font-size: .74em;\n  font-weight: 600;\n  line-height: 1;\n  color: var(--accent-deep);\n  background: var(--accent-soft);\n  padding: 6px 13px;\n  border-radius: 999px;\n  white-space: nowrap;\n  max-width: 55%;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.source-badge:empty { display: none; }\n\n/* ===== แผงเนื้อหา: ยืดเต็มความสูงที่เหลือ ===== */\n.panel {\n  flex: 1 1 auto;\n  display: flex;\n  flex-direction: column;\n  background: var(--panel);\n  border: 1px solid var(--panel-line);\n  border-top: 4px solid var(--accent);\n  border-radius: 14px;\n  box-shadow: var(--shadow);\n  overflow: hidden;\n  margin-bottom: 0;\n}\n\n/* ===== โซนภายในแผง ===== */\n.zone { padding: 24px 28px 26px; flex: 0 0 auto; }\n\n/* หน้า BACK: โซนเฉลยยืดเต็มพื้นที่ที่เหลือ */\n.solution-zone {\n  flex: 1 1 auto;\n  background: var(--solution-bg);\n  border-top: 1px solid var(--panel-line);\n  padding: 18px 28px 32px;\n}\n\n/* หน้า FRONT: ให้โซนโจทย์ยืดเต็มแผง */\n.panel > .zone:only-child { flex: 1 1 auto; }\n\n.solution-inline-label {\n  font-family: var(--font-ui);\n  font-size: .78em;\n  font-weight: 700;\n  letter-spacing: .4px;\n  color: var(--accent-deep);\n  margin-bottom: 6px;\n}\n\n/* ===== Takeaway ===== */\n.takeaway {\n  display: flex;\n  gap: 8px;\n  align-items: baseline;\n  background: var(--alert-soft);\n  border-left: 3px solid var(--alert-accent);\n  border-radius: 0 8px 8px 0;\n  padding: 7px 12px;\n  margin: 16px 0 0;\n  font-size: .9em;\n  line-height: 1.6;\n  color: var(--alert-text);\n}\n.takeaway-label {\n  font-family: var(--font-ui);\n  font-weight: 700;\n  color: var(--alert-accent);\n  white-space: nowrap;\n}\n\n/* ===== ป้ายหัวข้อ ===== */\n.section-label {\n  font-family: var(--font-ui);\n  font-size: .8em;\n  font-weight: 700;\n  letter-spacing: .4px;\n  color: var(--text-muted);\n}\n\n/* ===== คณิตศาสตร์ ===== */\n.math-content { line-height: 1.85; }\n\n.math-content i,\n.math-content var,\n.MathJax { font-family: var(--font-math) !important; font-size: 1.04em; }\n\nmjx-container[display=\"true\"],\n.MathJax_Display {\n  margin: 14px 0 !important;\n  padding: 2px 0 6px;\n  overflow-x: auto;\n  overflow-y: hidden;\n}\n\n/* ===== รูปภาพ ===== */\nimg {\n  max-width: 100%;\n  height: auto;\n  border-radius: 10px;\n  margin: 14px 0;\n  border: 1px solid var(--panel-line);\n  background: #fff;\n}\n.nightMode img { filter: brightness(.9) contrast(1.05); }\n\n/* ===== iPad / แท็บเล็ต (ครึ่งจอ แนวยาว-แนวตั้งของพื้นที่) ===== */\n@media (min-width: 600px) and (max-width: 1100px) {\n  .card { padding: 14px 16px 28px; }\n  .zone { padding: 22px 24px 24px; }\n  .solution-zone { padding: 16px 24px 30px; }\n}\n\n/* ===== จอเล็ก / ครึ่งจอแคบ ===== */\n@media (max-width: 599px) {\n  .card { padding: 12px 10px 24px; }\n  .main-container { min-height: calc(100vh - 36px); }\n  .panel { border-radius: 12px; }\n  .zone { padding: 18px 16px 20px; }\n  .solution-zone { padding: 14px 16px 24px; }\n}\n\n/* ===== จอกว้างมาก (โน้ตบุ๊ก/เดสก์ท็อป) ===== */\n@media (min-width: 1400px) {\n  .card { padding: 22px 36px 40px; }\n  .zone { padding: 30px 40px 32px; }\n  .solution-zone { padding: 24px 40px 40px; }\n}\n\n/* ===== หมายเหตุ: ใช้ฟอนต์ออฟไลน์ =====\nวางไฟล์ .ttf ไว้ใน collection.media โดยตั้งชื่อขึ้นต้นด้วย _ (เช่น _IBMPlexSansThai.ttf)\nแล้วลบบรรทัด @import ด้านบน เปลี่ยนเป็น:\n\n@font-face { font-family: 'IBM Plex Sans Thai'; src: url('_IBMPlexSansThai-Regular.ttf'); font-weight: 400; }\n@font-face { font-family: 'IBM Plex Sans Thai'; src: url('_IBMPlexSansThai-Bold.ttf');    font-weight: 700; }\n*/", "tmpls": [{"name": "Card 1", "front": "<div class=\"main-container\">\n\n<div class=\"card-head\">\n<div class=\"section-label\">โจทย์<\/div>\n<div class=\"source-badge\">{{source}}<\/div>\n<\/div>\n\n<div class=\"panel\">\n<div class=\"zone\">\n<div class=\"math-content\">{{Question}}<\/div>\n<\/div>\n<\/div>\n\n<\/div>", "back": "<div class=\"main-container\">\n\n<div class=\"card-head\">\n<div class=\"section-label\">โจทย์ + เฉลย<\/div>\n<div class=\"source-badge\">{{source}}<\/div>\n<\/div>\n\n<div class=\"panel\">\n\n<div class=\"zone\">\n<div class=\"math-content\">{{Question}}<\/div>\n\n{{#Takeaway}}\n<div class=\"takeaway\">\n<span class=\"takeaway-label\">⚠ จุดตาย<\/span>\n<span>{{Takeaway}}<\/span>\n<\/div>\n{{/Takeaway}}\n<\/div>\n\n<div class=\"solution-zone\">\n<div class=\"solution-inline-label\">เฉลยละเอียด<\/div>\n<div class=\"math-content\">{{Solution}}<\/div>\n<\/div>\n\n<\/div>\n\n<\/div>"}]}, {"name": "Error Log TGAT-TPAT", "notes": 329, "fields": ["Question", "Figure", "Options", "Answer", "Takeaway", "Trap", "Solution", "Source", "Page"], "css": "/* tgat-tpat-css v2.0 | 2026-11-21\n   ใช้ CSS ชุดเดียวกันทั้งสองโน้ตไทป์ (Problem / Knowledge)\n   ฟอนต์ฝังออฟไลน์: ต้องมีไฟล์ _IBMPlexSansThai-*.woff2 ใน collection.media (ดูหมายเหตุท้ายไฟล์) */\n\n@font-face {\n  font-family: 'IBM Plex Sans Thai'; font-style: normal; font-weight: 400; font-display: swap;\n  src: url('_IBMPlexSansThai-Regular.woff2') format('woff2');\n}\n@font-face {\n  font-family: 'IBM Plex Sans Thai'; font-style: normal; font-weight: 600; font-display: swap;\n  src: url('_IBMPlexSansThai-SemiBold.woff2') format('woff2');\n}\n@font-face {\n  font-family: 'IBM Plex Sans Thai'; font-style: normal; font-weight: 700; font-display: swap;\n  src: url('_IBMPlexSansThai-Bold.woff2') format('woff2');\n}\n\n:root {\n  --font-body: 'IBM Plex Sans Thai', 'Noto Sans Thai', -apple-system, 'Segoe UI', sans-serif;\n  --font-ui:   var(--font-body);\n  --font-math: 'Source Serif 4', 'Noto Serif', Georgia, 'Times New Roman', serif;\n\n  --bg:          #fafafa;\n  --panel:       #fafafa;\n  --panel-line:  #dfe3e7;\n  --text-main:   #1e2a30;\n  --text-muted:  #626d76;\n  --accent:      #0f8b8d;\n  --accent-deep: #0b6e70;\n  --accent-soft: #e3f3f3;\n  --shadow:      0 1px 3px rgba(20,40,50,.08);\n\n  --alert-accent: #e4572e;\n  --alert-text:   #9a3412;\n  --alert-soft:   #fdeee8;\n\n  /* สีเส้น / ขอบ (คงเดิม) */\n  --c-blue: #4da6ff;   /* แนวคิด / สิ่งที่วิธีแก้สร้างขึ้น */\n  --c-red:  #ff5252;   /* คำตอบ / จุดที่พลาด */\n  --c-ok:   #1a9d5c;   /* ตัวเลือกที่ถูก (เฉพาะหน้าเฉลย) */\n\n  /* สีตัวอักษร: เข้มกว่าสีเส้นในโหมดสว่างให้คอนทราสต์ผ่าน 4.5:1 (โหมดมืดใกล้เคียงสีเส้น แดงสว่างขึ้นนิดเพื่ออ่านบนกล่องเฉลย) */\n  --ink-blue:   #106bc7;\n  --ink-red:    #d71111;\n  --ink-ok:     #1e7b4d;\n  --accent-ink: #167778;\n  --alert-ink:  #b94726;\n\n  --fs-base: clamp(16px, 1.1vw + 11px, 21px);\n\n  /* ระยะขอบการ์ด: ใช้คำนวณความสูงขั้นต่ำให้ไม่เกินจอ (แก้ในมีเดียควีรีที่เดียว) */\n  --pad-t: 16px; --pad-b: 32px; --pad-x: 18px;\n  --pad-y: calc(var(--pad-t) + var(--pad-b));\n}\n@media (max-width: 599px)  { :root { --pad-t: 12px; --pad-b: 24px; --pad-x: 10px; } }\n@media (min-width: 1400px) { :root { --pad-t: 22px; --pad-b: 40px; --pad-x: 36px; } }\n\n.nightMode, .night_mode {\n  --bg:          #121416;\n  --panel:       #121416;\n  --panel-line:  #2c3236;\n  --text-main:   #e9eef0;\n  --text-muted:  #93a1a8;\n  --accent:      #3fc1c0;\n  --accent-deep: #7ddbd9;\n  --accent-soft: #163236;\n  --shadow:      0 1px 3px rgba(0,0,0,.4);\n\n  --alert-accent: #ff8a65;\n  --alert-text:   #ffc9b5;\n  --alert-soft:   #33201a;\n\n  --c-ok: #4fd18b;\n\n  --ink-blue:   #4da6ff;\n  --ink-red:    #ff6161;\n  --ink-ok:     #4fd18b;\n  --accent-ink: #3fc1c0;\n  --alert-ink:  #ff8a65;\n}\n\nhtml, body { margin: 0; padding: 0; min-height: 100%; }\n/* พื้นหลังตั้งที่ body อย่างเดียว เพื่อให้สีโหมดมืดไหลไปทั้งหน้า (html อ่านตัวแปรจาก :root ซึ่งเป็นสีสว่างเสมอ) */\nbody { background: var(--bg); }\n\n.card {\n  font-family: var(--font-body);\n  font-size: var(--fs-base);\n  font-weight: 400;\n  line-height: 1.8;\n  color: var(--text-main);\n  background: var(--bg);\n  min-height: 100vh;\n  box-sizing: border-box;\n  padding: var(--pad-t) var(--pad-x) var(--pad-b);\n  text-align: left;\n  -webkit-text-size-adjust: 100%;\n}\n\n.main-container { width: 100%; margin: 0; display: flex; flex-direction: column; min-height: calc(100vh - var(--pad-y)); }\n\n/* ===== หัวการ์ด ===== */\n.card-head {\n  display: flex; align-items: center; justify-content: space-between;\n  gap: 10px; min-height: 30px; margin-bottom: 10px;\n}\n.head-left { display: flex; align-items: center; gap: 8px; min-width: 0; }\n\n.section-label {\n  font-family: var(--font-ui); font-size: .8em; font-weight: 700;\n  letter-spacing: .4px; color: var(--text-muted);\n}\n.kind-badge {\n  font-family: var(--font-ui); font-size: .72em; font-weight: 700; line-height: 1;\n  color: var(--alert-text); background: var(--alert-soft);\n  padding: 5px 10px; border-radius: 999px; white-space: nowrap;\n}\n.source-badge {\n  font-family: var(--font-ui); font-size: .74em; font-weight: 600; line-height: 1;\n  color: var(--accent-deep); background: var(--accent-soft);\n  padding: 6px 13px; border-radius: 999px; white-space: nowrap;\n  max-width: 58%; overflow: hidden; text-overflow: ellipsis;\n}\n.source-badge:empty, .kind-badge:empty { display: none; }\n\n/* ===== แผง ===== */\n.panel {\n  flex: 1 1 auto; display: flex; flex-direction: column;\n  background: var(--panel); border: 1px solid var(--panel-line);\n  border-top: 4px solid var(--accent); border-radius: 14px;\n  box-shadow: var(--shadow); overflow: hidden;\n}\n.zone { padding: 22px 26px 24px; flex: 0 0 auto; }\n.panel > .zone:only-child { flex: 1 1 auto; }\n\n.answer-bar {\n  display: flex; align-items: center; flex-wrap: wrap; gap: 10px;\n  padding: 12px 26px; border-top: 1px solid var(--panel-line);\n  background: var(--accent-soft);\n  font-family: var(--font-ui); font-weight: 700; color: var(--accent-deep);\n}\n.answer-chip {\n  font-size: 1.05em; padding: 2px 14px; border-radius: 8px;\n  border: 2px solid var(--accent); color: var(--accent-deep);\n}\n.verdict { font-size: .88em; font-weight: 600; color: var(--text-muted); }\n.verdict.ok  { color: var(--ink-ok); }\n.verdict.bad { color: var(--alert-ink); }\n\n.solution-zone {\n  flex: 1 1 auto; border-top: 1px solid var(--panel-line);\n  padding: 18px 26px 30px;\n}\n.solution-inline-label {\n  font-family: var(--font-ui); font-size: .78em; font-weight: 700;\n  letter-spacing: .4px; color: var(--accent-deep); margin-bottom: 6px;\n}\n\n/* ===== ใจความ (วิธีลัด) และ จุดตาย ===== */\n.insight, .takeaway {\n  display: flex; gap: 8px; align-items: baseline;\n  border-radius: 0 8px 8px 0; padding: 8px 12px; margin: 14px 0 0;\n  font-size: .92em; line-height: 1.6;\n}\n.insight  { background: var(--accent-soft); border-left: 3px solid var(--accent); color: var(--accent-deep); }\n.takeaway { background: var(--alert-soft);  border-left: 3px solid var(--alert-accent); color: var(--alert-text); }\n.insight-label, .takeaway-label { font-family: var(--font-ui); font-weight: 700; white-space: nowrap; }\n.insight-label  { color: var(--accent-ink); }\n.takeaway-label { color: var(--alert-ink); }\n.insight-wrap, .takeaway-wrap { padding: 0 26px; }\n\n/* ===== คณิตศาสตร์ / ข้อความ ===== */\n.math-content { line-height: 1.85; overflow-wrap: break-word; overflow-wrap: anywhere; }\n.math-content i, .math-content var, .MathJax { font-family: var(--font-math) !important; font-size: 1.04em; }\nmjx-container[display=\"true\"], .MathJax_Display { margin: 14px 0 !important; overflow-x: auto; overflow-y: hidden; }\n\n/* ตาราง: กว้างเกินจอให้เลื่อนในตัวเอง ไม่ดันทั้งการ์ด */\n.math-content table {\n  display: block; width: max-content; max-width: 100%; margin: 12px auto; overflow-x: auto;\n  border-collapse: collapse; font-variant-numeric: tabular-nums; -webkit-overflow-scrolling: touch;\n  overflow-wrap: normal;   /* ไม่ให้ตัวเลขในช่องถูกตัดกลางคำ: กว้างเกินให้เลื่อนข้างแทน */\n}\n.math-content th, .math-content td { border: 1px solid var(--panel-line); padding: 6px 12px; text-align: center; }\n.math-content th { background: var(--accent-soft); color: var(--accent-deep); font-family: var(--font-ui); font-weight: 600; }\n\n/* วิธีทำยาว: ใส่ใน Answer เป็น <details><summary>วิธีทำ<\/summary>...<\/details> จะพับไว้ */\n.math-content details {\n  margin: 12px 0 0; padding: 0 14px; border: 1px solid var(--panel-line);\n  border-radius: 10px; background: var(--panel);\n}\n.math-content details[open] { padding-bottom: 10px; }\n.math-content summary {\n  display: block; margin: 0 -14px; padding: 8px 14px; cursor: pointer; list-style: none;\n  font-family: var(--font-ui); font-size: .86em; font-weight: 600; color: var(--accent-deep);\n  -webkit-tap-highlight-color: transparent;\n}\n.math-content summary::-webkit-details-marker { display: none; }\n.math-content summary::before {\n  content: ''; display: inline-block; vertical-align: middle; margin: -2px 8px 0 0;\n  border-left: 6px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent;\n  transition: transform .15s;\n}\n.math-content details[open] > summary::before { transform: rotate(90deg); }\n.math-content details[open] > summary { margin-bottom: 8px; border-bottom: 1px dashed var(--panel-line); }\n\n/* ข้อความสีในฟิลด์ (ตัวอักษร ไม่ใช่เส้น) */\n.t-blue { color: var(--ink-blue); }\n.t-red  { color: var(--ink-red); }\n.t-ok   { color: var(--ink-ok); }\n\n/* ===== รูป / SVG ===== */\n.fig { margin: 14px 0 6px; text-align: center; }\n.fig svg, .math-content svg { max-width: 100%; height: auto; vertical-align: middle; }\nimg { max-width: 100%; height: auto; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--panel-line); background: #fff; }\n.nightMode img, .night_mode img { filter: brightness(.9) contrast(1.05); }\n\n/* ส่วนของ Figure ที่โผล่เฉพาะหลังพลิก (.ans-only) หรือหายหลังพลิก (.front-only)\n   ต้องมี class side-front / side-back ที่ .main-container ของเทมเพลตนั้น */\n.side-front .ans-only, .side-back .front-only { display: none !important; }\n\n/* รูปเส้นดำพื้นขาว / SVG เก่าที่ใช้สีดำตายตัว: ติดแท็ก fig-inv ที่โน้ต เพื่อกลับสีเฉพาะโหมดมืด\n   (ห้ามติดกับ SVG ที่เขียนเป็น currentColor แล้ว เพราะจะกลับสีซ้ำจนเส้นมืดหาย) */\n.nightMode [data-tags~=\"fig-inv\"] .fig img, .night_mode [data-tags~=\"fig-inv\"] .fig img {\n  filter: invert(1) hue-rotate(180deg); border-color: #d3cdc9; mix-blend-mode: lighten;\n}\n.nightMode [data-tags~=\"fig-inv\"] .fig svg, .night_mode [data-tags~=\"fig-inv\"] .fig svg {\n  filter: invert(1) hue-rotate(180deg);\n}\n\n/* ===== ตัวเลือกปรนัย (แตะเลือกได้ ถ้าไม่มี JS ก็ยังใช้อ่านได้) ===== */\n.options { margin-top: 16px; }\n.opt {\n  display: block; margin: 8px 0; padding: 9px 14px;\n  border: 1.5px solid var(--panel-line); border-radius: 10px;\n  cursor: pointer; -webkit-tap-highlight-color: transparent;\n}\n.opt b { color: var(--text-muted); margin-right: 4px; }\n.opt.picked  { border-color: var(--accent); }\n.opt.correct { border-color: var(--c-ok); border-width: 2.5px; }\n.opt.correct b { color: var(--ink-ok); }\n.opt.wrong   { border-color: var(--alert-accent); border-width: 2.5px; border-style: dashed; }\n.opt.wrong b { color: var(--alert-ink); }\n\n/* ตัวเลือกที่เป็นรูป: ใส่ class='opt fo' เพื่อจัดเป็นสองคอลัมน์\n   (กว้าง 50% - 14px เผื่อช่องว่างที่ HTML คั่นระหว่างตัวเลือก ของเดิม 50% - 10px พอมีช่องว่างจะตกเป็นคอลัมน์เดียว) */\n.opt.fo { display: inline-block; vertical-align: top; width: calc(50% - 14px); margin: 5px; text-align: center; box-sizing: border-box; }\n.opt.fo svg { display: block; margin: 4px auto 0; max-width: 100%; height: auto; }\n@media (max-width: 360px) { .opt.fo { width: 100%; margin: 5px 0; } }\n\n/* ===== ช่องตัวเลข: อนุกรม / ตาราง / รูปแบบ ===== */\n.seq { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin: 12px 0; }\n.cell {\n  display: inline-block; min-width: 2.1em; padding: .15em .55em; box-sizing: border-box;\n  text-align: center; border: 1.5px solid var(--panel-line); border-radius: 8px;\n  font-variant-numeric: tabular-nums;\n}\n.cell.q   { border-style: dashed; border-color: var(--accent); color: var(--accent-deep); font-weight: 700; }\n.cell.hi  { border-color: var(--c-blue); }\n.cell.ans { border-color: var(--c-red); color: var(--ink-red); font-weight: 700; }\n.op    { font-size: .8em; color: var(--ink-blue); font-weight: 600; white-space: nowrap; }\n.arrow { color: var(--text-muted); }\n\n.grid { display: grid; gap: 6px; margin: 12px auto; max-width: 100%; }\n.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }\n.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }\n.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }\n.g5 { grid-template-columns: repeat(5, minmax(0,1fr)); }\n.g6 { grid-template-columns: repeat(6, minmax(0,1fr)); }\n.grid .cell { min-width: 0; }\n\n/* ===== การ์ดความรู้ ===== */\n.q-text { color: var(--text-main); }\n.back-q { font-size: .88em; color: var(--text-muted); padding-bottom: 12px; border-bottom: 1px dashed var(--panel-line); margin-bottom: 14px; }\n\n/* เฉลยอยู่ใต้โจทย์ย่อ ก่อน Figure (id=\"answer\" ให้ Anki เลื่อนมาที่นี่เองถ้าโจทย์ยาว) */\n.k-answer-box {\n  margin: 0 0 14px; padding: 14px 18px;\n  background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 0 12px 12px 0;\n}\n.k-answer { font-size: 1.05em; }\n.k-answer > :first-child { margin-top: 0; }\n.k-answer > :last-child  { margin-bottom: 0; }\n\n/* Note: อ่านง่ายขึ้น และเป็นโทนเตือนเมื่อเป็นการ์ดเสริม (มี Origin) */\n.k-note {\n  margin-top: 14px; padding: 10px 14px; font-size: .95em; line-height: 1.7;\n  color: var(--text-main); border-left: 3px solid var(--text-muted); border-radius: 0 8px 8px 0;\n}\n.k-note.warn { color: var(--alert-text); background: var(--alert-soft); border-left-color: var(--alert-accent); }\n\n.origin {\n  margin-top: 16px; padding: 8px 12px; border-radius: 8px; font-size: .82em;\n  font-family: var(--font-ui); color: var(--alert-text); background: var(--alert-soft);\n}\n.origin b { color: var(--alert-ink); }\n\n/* การ์ดที่ติดแท็ก leech: ขึ้นข้อความเตือนให้เขียนใหม่ (ซ่อนไว้ตามปกติ) */\n.leech-banner {\n  display: none; margin-top: 16px; padding: 10px 14px; border-radius: 8px;\n  font-family: var(--font-ui); font-size: .84em; line-height: 1.6;\n  color: var(--alert-text); background: var(--alert-soft); border: 1px dashed var(--alert-accent);\n}\n[data-tags~=\"leech\"] .leech-banner { display: block; }\n\n/* ===== หน้าจอแคบ / กว้าง (ระยะขอบการ์ดอยู่ในตัวแปร --pad-* ด้านบน) ===== */\n@media (max-width: 599px) {\n  .panel { border-radius: 12px; }\n  .zone { padding: 18px 16px 20px; }\n  .answer-bar { padding: 10px 16px; }\n  .solution-zone { padding: 14px 16px 24px; }\n  .insight-wrap, .takeaway-wrap { padding: 0 16px; }\n  .k-answer-box { padding: 12px 14px; }\n}\n@media (min-width: 1400px) {\n  .zone { padding: 30px 40px 32px; }\n  .answer-bar { padding: 14px 40px; }\n  .solution-zone { padding: 24px 40px 40px; }\n  .insight-wrap, .takeaway-wrap { padding: 0 40px; }\n}\n\n/* ===== หมายเหตุการใช้งาน =====\n1) ฟอนต์ออฟไลน์: คัดลอก _IBMPlexSansThai-Regular / SemiBold / Bold .woff2 ลง collection.media\n   (push_to_anki.py อัปโหลดให้เอง) ชื่อขึ้นต้นด้วย _ เพื่อไม่ให้ Check Media ลบทิ้ง\n2) SVG ใน Figure: เขียนเส้น/ข้อความสีปกติเป็น currentColor (ตามโหมดสว่าง/มืดเอง)\n   เส้นฟ้า/แดง: style=\"stroke:var(--c-blue)\" / var(--c-red)   ข้อความฟ้า/แดง: style=\"fill:var(--ink-blue)\" / var(--ink-red)\n3) โผล่เฉพาะหลังพลิก: class=\"ans-only\"   หายหลังพลิก (เช่นเครื่องหมาย ?): class=\"front-only\"\n   (ต้องมี class side-front / side-back ที่ .main-container ของเทมเพลต)\n4) รูปหรือ SVG เก่าที่เป็นเส้นดำพื้นขาว: ติดแท็ก fig-inv ที่โน้ต จะกลับสีเฉพาะโหมดมืด (ไม่ใช้กับ SVG ที่ใช้ currentColor แล้ว)\n5) ข้อความสีในฟิลด์: <span class=\"t-blue\"> / t-red / t-ok\n6) แท็กในเทมเพลตใช้ผ่าน data-tags=\"{{Tags}}\" ที่ .main-container */", "tmpls": [{"name": "Card 1", "front": "<div class=\"main-container\">\n\n<div class=\"card-head\">\n<div class=\"head-left\"><div class=\"section-label\">โจทย์<\/div><\/div>\n<div class=\"source-badge\">{{Source}}<\/div>\n<\/div>\n\n<div class=\"panel\">\n<div class=\"zone\">\n<div class=\"math-content\">{{Question}}<\/div>\n\n{{#Figure}}<div class=\"fig\">{{Figure}}<\/div>{{/Figure}}\n\n{{#Options}}<div class=\"options\" id=\"opts\">{{Options}}<\/div>{{/Options}}\n<\/div>\n<\/div>\n\n<\/div>\n\n<script>\n/* แตะตัวเลือกเพื่อทำเครื่องหมาย (ไม่จำเป็นต้องมี JS การ์ดก็ใช้งานได้) */\n(function () {\n  try { sessionStorage.removeItem('tt_pick'); } catch (e) {}\n  var box = document.getElementById('opts');\n  if (!box) return;\n  box.addEventListener('click', function (ev) {\n    var o = ev.target;\n    while (o && o !== box && !(o.className && (' ' + o.className + ' ').indexOf(' opt ') > -1)) { o = o.parentNode; }\n    if (!o || o === box) return;\n    var all = box.querySelectorAll('.opt');\n    for (var i = 0; i < all.length; i++) { all[i].className = all[i].className.replace(' picked', ''); }\n    o.className += ' picked';\n    try { sessionStorage.setItem('tt_pick', o.getAttribute('data-k')); } catch (e) {}\n  });\n})();\n<\/script>", "back": "<div class=\"main-container\">\n\n<div class=\"card-head\">\n<div class=\"head-left\"><div class=\"section-label\">โจทย์ + เฉลย<\/div><\/div>\n<div class=\"source-badge\">{{Source}}<\/div>\n<\/div>\n\n<div class=\"panel\">\n\n<div class=\"zone\">\n<div class=\"math-content\">{{Question}}<\/div>\n\n{{#Figure}}<div class=\"fig\">{{Figure}}<\/div>{{/Figure}}\n\n{{#Options}}<div class=\"options\" id=\"opts\">{{Options}}<\/div>{{/Options}}\n<\/div>\n\n<div class=\"answer-bar\">\n<span>คำตอบ<\/span>\n<span class=\"answer-chip\" id=\"ans\">{{Answer}}<\/span>\n<span class=\"verdict\" id=\"verdict\"><\/span>\n<\/div>\n\n{{#Takeaway}}\n<div class=\"insight-wrap\"><div class=\"insight\">\n<span class=\"insight-label\">ใจความ<\/span>\n<span>{{Takeaway}}<\/span>\n<\/div><\/div>\n{{/Takeaway}}\n\n{{#Trap}}\n<div class=\"takeaway-wrap\"><div class=\"takeaway\">\n<span class=\"takeaway-label\">⚠ จุดตาย<\/span>\n<span>{{Trap}}<\/span>\n<\/div><\/div>\n{{/Trap}}\n\n<div class=\"solution-zone\">\n<div class=\"solution-inline-label\">เฉลยแบบเร็ว<\/div>\n<div class=\"math-content\">{{Solution}}<\/div>\n<\/div>\n\n<\/div>\n\n<\/div>\n\n<script>\n/* ไฮไลต์ตัวเลือกที่ถูก และเทียบกับที่แตะไว้หน้าโจทย์ (ถ้ามี) */\n(function () {\n  var ansEl = document.getElementById('ans');\n  var box = document.getElementById('opts');\n  if (!ansEl || !box) return;\n  var key = (ansEl.textContent || '').replace(/\\s+/g, '').toUpperCase();\n  var pick = '';\n  try { pick = (sessionStorage.getItem('tt_pick') || '').replace(/\\s+/g, '').toUpperCase(); } catch (e) {}\n  var all = box.querySelectorAll('.opt');\n  for (var i = 0; i < all.length; i++) {\n    var k = (all[i].getAttribute('data-k') || '').replace(/\\s+/g, '').toUpperCase();\n    if (k === key) { all[i].className += ' correct'; }\n    else if (pick && k === pick) { all[i].className += ' wrong'; }\n  }\n  var v = document.getElementById('verdict');\n  if (v && pick) {\n    if (pick === key) { v.className = 'verdict ok'; v.textContent = '✓ ตอบถูก'; }\n    else { v.className = 'verdict bad'; v.textContent = '✗ ที่แตะไว้คือ ' + pick; }\n  }\n})();\n<\/script>"}]}, {"name": "Error Log TGAT-TPAT Content", "notes": 1676, "fields": ["Question", "Figure", "Answer", "Note", "Origin", "Source"], "css": "/* tgat-tpat-css v2.0 | 2026-11-21\n   ใช้ CSS ชุดเดียวกันทั้งสองโน้ตไทป์ (Problem / Knowledge)\n   ฟอนต์ฝังออฟไลน์: ต้องมีไฟล์ _IBMPlexSansThai-*.woff2 ใน collection.media (ดูหมายเหตุท้ายไฟล์) */\n\n@font-face {\n  font-family: 'IBM Plex Sans Thai'; font-style: normal; font-weight: 400; font-display: swap;\n  src: url('_IBMPlexSansThai-Regular.woff2') format('woff2');\n}\n@font-face {\n  font-family: 'IBM Plex Sans Thai'; font-style: normal; font-weight: 600; font-display: swap;\n  src: url('_IBMPlexSansThai-SemiBold.woff2') format('woff2');\n}\n@font-face {\n  font-family: 'IBM Plex Sans Thai'; font-style: normal; font-weight: 700; font-display: swap;\n  src: url('_IBMPlexSansThai-Bold.woff2') format('woff2');\n}\n\n:root {\n  --font-body: 'IBM Plex Sans Thai', 'Noto Sans Thai', -apple-system, 'Segoe UI', sans-serif;\n  --font-ui:   var(--font-body);\n  --font-math: 'Source Serif 4', 'Noto Serif', Georgia, 'Times New Roman', serif;\n\n  --bg:          #fafafa;\n  --panel:       #fafafa;\n  --panel-line:  #dfe3e7;\n  --text-main:   #1e2a30;\n  --text-muted:  #626d76;\n  --accent:      #0f8b8d;\n  --accent-deep: #0b6e70;\n  --accent-soft: #e3f3f3;\n  --shadow:      0 1px 3px rgba(20,40,50,.08);\n\n  --alert-accent: #e4572e;\n  --alert-text:   #9a3412;\n  --alert-soft:   #fdeee8;\n\n  /* สีเส้น / ขอบ (คงเดิม) */\n  --c-blue: #4da6ff;   /* แนวคิด / สิ่งที่วิธีแก้สร้างขึ้น */\n  --c-red:  #ff5252;   /* คำตอบ / จุดที่พลาด */\n  --c-ok:   #1a9d5c;   /* ตัวเลือกที่ถูก (เฉพาะหน้าเฉลย) */\n\n  /* สีตัวอักษร: เข้มกว่าสีเส้นในโหมดสว่างให้คอนทราสต์ผ่าน 4.5:1 (โหมดมืดใกล้เคียงสีเส้น แดงสว่างขึ้นนิดเพื่ออ่านบนกล่องเฉลย) */\n  --ink-blue:   #106bc7;\n  --ink-red:    #d71111;\n  --ink-ok:     #1e7b4d;\n  --accent-ink: #167778;\n  --alert-ink:  #b94726;\n\n  --fs-base: clamp(16px, 1.1vw + 11px, 21px);\n\n  /* ระยะขอบการ์ด: ใช้คำนวณความสูงขั้นต่ำให้ไม่เกินจอ (แก้ในมีเดียควีรีที่เดียว) */\n  --pad-t: 16px; --pad-b: 32px; --pad-x: 18px;\n  --pad-y: calc(var(--pad-t) + var(--pad-b));\n}\n@media (max-width: 599px)  { :root { --pad-t: 12px; --pad-b: 24px; --pad-x: 10px; } }\n@media (min-width: 1400px) { :root { --pad-t: 22px; --pad-b: 40px; --pad-x: 36px; } }\n\n.nightMode, .night_mode {\n  --bg:          #121416;\n  --panel:       #121416;\n  --panel-line:  #2c3236;\n  --text-main:   #e9eef0;\n  --text-muted:  #93a1a8;\n  --accent:      #3fc1c0;\n  --accent-deep: #7ddbd9;\n  --accent-soft: #163236;\n  --shadow:      0 1px 3px rgba(0,0,0,.4);\n\n  --alert-accent: #ff8a65;\n  --alert-text:   #ffc9b5;\n  --alert-soft:   #33201a;\n\n  --c-ok: #4fd18b;\n\n  --ink-blue:   #4da6ff;\n  --ink-red:    #ff6161;\n  --ink-ok:     #4fd18b;\n  --accent-ink: #3fc1c0;\n  --alert-ink:  #ff8a65;\n}\n\nhtml, body { margin: 0; padding: 0; min-height: 100%; }\n/* พื้นหลังตั้งที่ body อย่างเดียว เพื่อให้สีโหมดมืดไหลไปทั้งหน้า (html อ่านตัวแปรจาก :root ซึ่งเป็นสีสว่างเสมอ) */\nbody { background: var(--bg); }\n\n.card {\n  font-family: var(--font-body);\n  font-size: var(--fs-base);\n  font-weight: 400;\n  line-height: 1.8;\n  color: var(--text-main);\n  background: var(--bg);\n  min-height: 100vh;\n  box-sizing: border-box;\n  padding: var(--pad-t) var(--pad-x) var(--pad-b);\n  text-align: left;\n  -webkit-text-size-adjust: 100%;\n}\n\n.main-container { width: 100%; margin: 0; display: flex; flex-direction: column; min-height: calc(100vh - var(--pad-y)); }\n\n/* ===== หัวการ์ด ===== */\n.card-head {\n  display: flex; align-items: center; justify-content: space-between;\n  gap: 10px; min-height: 30px; margin-bottom: 10px;\n}\n.head-left { display: flex; align-items: center; gap: 8px; min-width: 0; }\n\n.section-label {\n  font-family: var(--font-ui); font-size: .8em; font-weight: 700;\n  letter-spacing: .4px; color: var(--text-muted);\n}\n.kind-badge {\n  font-family: var(--font-ui); font-size: .72em; font-weight: 700; line-height: 1;\n  color: var(--alert-text); background: var(--alert-soft);\n  padding: 5px 10px; border-radius: 999px; white-space: nowrap;\n}\n.source-badge {\n  font-family: var(--font-ui); font-size: .74em; font-weight: 600; line-height: 1;\n  color: var(--accent-deep); background: var(--accent-soft);\n  padding: 6px 13px; border-radius: 999px; white-space: nowrap;\n  max-width: 58%; overflow: hidden; text-overflow: ellipsis;\n}\n.source-badge:empty, .kind-badge:empty { display: none; }\n\n/* ===== แผง ===== */\n.panel {\n  flex: 1 1 auto; display: flex; flex-direction: column;\n  background: var(--panel); border: 1px solid var(--panel-line);\n  border-top: 4px solid var(--accent); border-radius: 14px;\n  box-shadow: var(--shadow); overflow: hidden;\n}\n.zone { padding: 22px 26px 24px; flex: 0 0 auto; }\n.panel > .zone:only-child { flex: 1 1 auto; }\n\n.answer-bar {\n  display: flex; align-items: center; flex-wrap: wrap; gap: 10px;\n  padding: 12px 26px; border-top: 1px solid var(--panel-line);\n  background: var(--accent-soft);\n  font-family: var(--font-ui); font-weight: 700; color: var(--accent-deep);\n}\n.answer-chip {\n  font-size: 1.05em; padding: 2px 14px; border-radius: 8px;\n  border: 2px solid var(--accent); color: var(--accent-deep);\n}\n.verdict { font-size: .88em; font-weight: 600; color: var(--text-muted); }\n.verdict.ok  { color: var(--ink-ok); }\n.verdict.bad { color: var(--alert-ink); }\n\n.solution-zone {\n  flex: 1 1 auto; border-top: 1px solid var(--panel-line);\n  padding: 18px 26px 30px;\n}\n.solution-inline-label {\n  font-family: var(--font-ui); font-size: .78em; font-weight: 700;\n  letter-spacing: .4px; color: var(--accent-deep); margin-bottom: 6px;\n}\n\n/* ===== ใจความ (วิธีลัด) และ จุดตาย ===== */\n.insight, .takeaway {\n  display: flex; gap: 8px; align-items: baseline;\n  border-radius: 0 8px 8px 0; padding: 8px 12px; margin: 14px 0 0;\n  font-size: .92em; line-height: 1.6;\n}\n.insight  { background: var(--accent-soft); border-left: 3px solid var(--accent); color: var(--accent-deep); }\n.takeaway { background: var(--alert-soft);  border-left: 3px solid var(--alert-accent); color: var(--alert-text); }\n.insight-label, .takeaway-label { font-family: var(--font-ui); font-weight: 700; white-space: nowrap; }\n.insight-label  { color: var(--accent-ink); }\n.takeaway-label { color: var(--alert-ink); }\n.insight-wrap, .takeaway-wrap { padding: 0 26px; }\n\n/* ===== คณิตศาสตร์ / ข้อความ ===== */\n.math-content { line-height: 1.85; overflow-wrap: break-word; overflow-wrap: anywhere; }\n.math-content i, .math-content var, .MathJax { font-family: var(--font-math) !important; font-size: 1.04em; }\nmjx-container[display=\"true\"], .MathJax_Display { margin: 14px 0 !important; overflow-x: auto; overflow-y: hidden; }\n\n/* ตาราง: กว้างเกินจอให้เลื่อนในตัวเอง ไม่ดันทั้งการ์ด */\n.math-content table {\n  display: block; width: max-content; max-width: 100%; margin: 12px auto; overflow-x: auto;\n  border-collapse: collapse; font-variant-numeric: tabular-nums; -webkit-overflow-scrolling: touch;\n  overflow-wrap: normal;   /* ไม่ให้ตัวเลขในช่องถูกตัดกลางคำ: กว้างเกินให้เลื่อนข้างแทน */\n}\n.math-content th, .math-content td { border: 1px solid var(--panel-line); padding: 6px 12px; text-align: center; }\n.math-content th { background: var(--accent-soft); color: var(--accent-deep); font-family: var(--font-ui); font-weight: 600; }\n\n/* วิธีทำยาว: ใส่ใน Answer เป็น <details><summary>วิธีทำ<\/summary>...<\/details> จะพับไว้ */\n.math-content details {\n  margin: 12px 0 0; padding: 0 14px; border: 1px solid var(--panel-line);\n  border-radius: 10px; background: var(--panel);\n}\n.math-content details[open] { padding-bottom: 10px; }\n.math-content summary {\n  display: block; margin: 0 -14px; padding: 8px 14px; cursor: pointer; list-style: none;\n  font-family: var(--font-ui); font-size: .86em; font-weight: 600; color: var(--accent-deep);\n  -webkit-tap-highlight-color: transparent;\n}\n.math-content summary::-webkit-details-marker { display: none; }\n.math-content summary::before {\n  content: ''; display: inline-block; vertical-align: middle; margin: -2px 8px 0 0;\n  border-left: 6px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent;\n  transition: transform .15s;\n}\n.math-content details[open] > summary::before { transform: rotate(90deg); }\n.math-content details[open] > summary { margin-bottom: 8px; border-bottom: 1px dashed var(--panel-line); }\n\n/* ข้อความสีในฟิลด์ (ตัวอักษร ไม่ใช่เส้น) */\n.t-blue { color: var(--ink-blue); }\n.t-red  { color: var(--ink-red); }\n.t-ok   { color: var(--ink-ok); }\n\n/* ===== รูป / SVG ===== */\n.fig { margin: 14px 0 6px; text-align: center; }\n.fig svg, .math-content svg { max-width: 100%; height: auto; vertical-align: middle; }\nimg { max-width: 100%; height: auto; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--panel-line); background: #fff; }\n.nightMode img, .night_mode img { filter: brightness(.9) contrast(1.05); }\n\n/* ส่วนของ Figure ที่โผล่เฉพาะหลังพลิก (.ans-only) หรือหายหลังพลิก (.front-only)\n   ต้องมี class side-front / side-back ที่ .main-container ของเทมเพลตนั้น */\n.side-front .ans-only, .side-back .front-only { display: none !important; }\n\n/* รูปเส้นดำพื้นขาว / SVG เก่าที่ใช้สีดำตายตัว: ติดแท็ก fig-inv ที่โน้ต เพื่อกลับสีเฉพาะโหมดมืด\n   (ห้ามติดกับ SVG ที่เขียนเป็น currentColor แล้ว เพราะจะกลับสีซ้ำจนเส้นมืดหาย) */\n.nightMode [data-tags~=\"fig-inv\"] .fig img, .night_mode [data-tags~=\"fig-inv\"] .fig img {\n  filter: invert(1) hue-rotate(180deg); border-color: #d3cdc9; mix-blend-mode: lighten;\n}\n.nightMode [data-tags~=\"fig-inv\"] .fig svg, .night_mode [data-tags~=\"fig-inv\"] .fig svg {\n  filter: invert(1) hue-rotate(180deg);\n}\n\n/* ===== ตัวเลือกปรนัย (แตะเลือกได้ ถ้าไม่มี JS ก็ยังใช้อ่านได้) ===== */\n.options { margin-top: 16px; }\n.opt {\n  display: block; margin: 8px 0; padding: 9px 14px;\n  border: 1.5px solid var(--panel-line); border-radius: 10px;\n  cursor: pointer; -webkit-tap-highlight-color: transparent;\n}\n.opt b { color: var(--text-muted); margin-right: 4px; }\n.opt.picked  { border-color: var(--accent); }\n.opt.correct { border-color: var(--c-ok); border-width: 2.5px; }\n.opt.correct b { color: var(--ink-ok); }\n.opt.wrong   { border-color: var(--alert-accent); border-width: 2.5px; border-style: dashed; }\n.opt.wrong b { color: var(--alert-ink); }\n\n/* ตัวเลือกที่เป็นรูป: ใส่ class='opt fo' เพื่อจัดเป็นสองคอลัมน์\n   (กว้าง 50% - 14px เผื่อช่องว่างที่ HTML คั่นระหว่างตัวเลือก ของเดิม 50% - 10px พอมีช่องว่างจะตกเป็นคอลัมน์เดียว) */\n.opt.fo { display: inline-block; vertical-align: top; width: calc(50% - 14px); margin: 5px; text-align: center; box-sizing: border-box; }\n.opt.fo svg { display: block; margin: 4px auto 0; max-width: 100%; height: auto; }\n@media (max-width: 360px) { .opt.fo { width: 100%; margin: 5px 0; } }\n\n/* ===== ช่องตัวเลข: อนุกรม / ตาราง / รูปแบบ ===== */\n.seq { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin: 12px 0; }\n.cell {\n  display: inline-block; min-width: 2.1em; padding: .15em .55em; box-sizing: border-box;\n  text-align: center; border: 1.5px solid var(--panel-line); border-radius: 8px;\n  font-variant-numeric: tabular-nums;\n}\n.cell.q   { border-style: dashed; border-color: var(--accent); color: var(--accent-deep); font-weight: 700; }\n.cell.hi  { border-color: var(--c-blue); }\n.cell.ans { border-color: var(--c-red); color: var(--ink-red); font-weight: 700; }\n.op    { font-size: .8em; color: var(--ink-blue); font-weight: 600; white-space: nowrap; }\n.arrow { color: var(--text-muted); }\n\n.grid { display: grid; gap: 6px; margin: 12px auto; max-width: 100%; }\n.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }\n.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }\n.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }\n.g5 { grid-template-columns: repeat(5, minmax(0,1fr)); }\n.g6 { grid-template-columns: repeat(6, minmax(0,1fr)); }\n.grid .cell { min-width: 0; }\n\n/* ===== การ์ดความรู้ ===== */\n.q-text { color: var(--text-main); }\n.back-q { font-size: .88em; color: var(--text-muted); padding-bottom: 12px; border-bottom: 1px dashed var(--panel-line); margin-bottom: 14px; }\n\n/* เฉลยอยู่ใต้โจทย์ย่อ ก่อน Figure (id=\"answer\" ให้ Anki เลื่อนมาที่นี่เองถ้าโจทย์ยาว) */\n.k-answer-box {\n  margin: 0 0 14px; padding: 14px 18px;\n  background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 0 12px 12px 0;\n}\n.k-answer { font-size: 1.05em; }\n.k-answer > :first-child { margin-top: 0; }\n.k-answer > :last-child  { margin-bottom: 0; }\n\n/* Note: อ่านง่ายขึ้น และเป็นโทนเตือนเมื่อเป็นการ์ดเสริม (มี Origin) */\n.k-note {\n  margin-top: 14px; padding: 10px 14px; font-size: .95em; line-height: 1.7;\n  color: var(--text-main); border-left: 3px solid var(--text-muted); border-radius: 0 8px 8px 0;\n}\n.k-note.warn { color: var(--alert-text); background: var(--alert-soft); border-left-color: var(--alert-accent); }\n\n.origin {\n  margin-top: 16px; padding: 8px 12px; border-radius: 8px; font-size: .82em;\n  font-family: var(--font-ui); color: var(--alert-text); background: var(--alert-soft);\n}\n.origin b { color: var(--alert-ink); }\n\n/* การ์ดที่ติดแท็ก leech: ขึ้นข้อความเตือนให้เขียนใหม่ (ซ่อนไว้ตามปกติ) */\n.leech-banner {\n  display: none; margin-top: 16px; padding: 10px 14px; border-radius: 8px;\n  font-family: var(--font-ui); font-size: .84em; line-height: 1.6;\n  color: var(--alert-text); background: var(--alert-soft); border: 1px dashed var(--alert-accent);\n}\n[data-tags~=\"leech\"] .leech-banner { display: block; }\n\n/* ===== หน้าจอแคบ / กว้าง (ระยะขอบการ์ดอยู่ในตัวแปร --pad-* ด้านบน) ===== */\n@media (max-width: 599px) {\n  .panel { border-radius: 12px; }\n  .zone { padding: 18px 16px 20px; }\n  .answer-bar { padding: 10px 16px; }\n  .solution-zone { padding: 14px 16px 24px; }\n  .insight-wrap, .takeaway-wrap { padding: 0 16px; }\n  .k-answer-box { padding: 12px 14px; }\n}\n@media (min-width: 1400px) {\n  .zone { padding: 30px 40px 32px; }\n  .answer-bar { padding: 14px 40px; }\n  .solution-zone { padding: 24px 40px 40px; }\n  .insight-wrap, .takeaway-wrap { padding: 0 40px; }\n}\n\n/* ===== หมายเหตุการใช้งาน =====\n1) ฟอนต์ออฟไลน์: คัดลอก _IBMPlexSansThai-Regular / SemiBold / Bold .woff2 ลง collection.media\n   (push_to_anki.py อัปโหลดให้เอง) ชื่อขึ้นต้นด้วย _ เพื่อไม่ให้ Check Media ลบทิ้ง\n2) SVG ใน Figure: เขียนเส้น/ข้อความสีปกติเป็น currentColor (ตามโหมดสว่าง/มืดเอง)\n   เส้นฟ้า/แดง: style=\"stroke:var(--c-blue)\" / var(--c-red)   ข้อความฟ้า/แดง: style=\"fill:var(--ink-blue)\" / var(--ink-red)\n3) โผล่เฉพาะหลังพลิก: class=\"ans-only\"   หายหลังพลิก (เช่นเครื่องหมาย ?): class=\"front-only\"\n   (ต้องมี class side-front / side-back ที่ .main-container ของเทมเพลต)\n4) รูปหรือ SVG เก่าที่เป็นเส้นดำพื้นขาว: ติดแท็ก fig-inv ที่โน้ต จะกลับสีเฉพาะโหมดมืด (ไม่ใช้กับ SVG ที่ใช้ currentColor แล้ว)\n5) ข้อความสีในฟิลด์: <span class=\"t-blue\"> / t-red / t-ok\n6) แท็กในเทมเพลตใช้ผ่าน data-tags=\"{{Tags}}\" ที่ .main-container */", "tmpls": [{"name": "Card 1", "front": "<div class=\"main-container side-front\" data-tags=\"{{Tags}}\">\n\n<div class=\"card-head\">\n<div class=\"head-left\">\n<div class=\"section-label\">ความรู้<\/div>\n{{#Origin}}<div class=\"kind-badge\">การ์ดเสริม<\/div>{{/Origin}}\n<\/div>\n<\/div>\n\n<div class=\"panel\">\n<div class=\"zone\">\n<div class=\"math-content q-text\">{{Question}}<\/div>\n{{#Figure}}<div class=\"fig\">{{Figure}}<\/div>{{/Figure}}\n<\/div>\n<\/div>\n\n<\/div>", "back": "<div class=\"main-container side-back\" data-tags=\"{{Tags}}\">\n\n<div class=\"card-head\">\n<div class=\"head-left\">\n<div class=\"section-label\">ความรู้ + เฉลย<\/div>\n{{#Origin}}<div class=\"kind-badge\">การ์ดเสริม<\/div>{{/Origin}}\n<\/div>\n<div class=\"source-badge\">{{Source}}<\/div>\n<\/div>\n\n<div class=\"panel\">\n<div class=\"zone\">\n<div class=\"math-content back-q\">{{Question}}<\/div>\n\n<div class=\"k-answer-box\" id=\"answer\">\n<div class=\"math-content k-answer\">{{Answer}}<\/div>\n<\/div>\n\n{{#Figure}}<div class=\"fig\">{{Figure}}<\/div>{{/Figure}}\n\n{{#Note}}<div class=\"math-content k-note{{#Origin}} warn{{/Origin}}\">{{Note}}<\/div>{{/Note}}\n{{#Origin}}<div class=\"origin\"><b>เกิดจาก<\/b> {{Origin}}<\/div>{{/Origin}}\n\n<div class=\"leech-banner\"><b>การ์ดนี้ตกซ้ำบ่อย (leech)<\/b> ลองเขียนใหม่ให้ถามแค่จุดเดียว แล้วเปลี่ยนตัวเลขดูว่ายังตอบได้<\/div>\n<\/div>\n<\/div>\n\n<\/div>"}]}, {"name": "Group", "notes": 0, "fields": ["ClusterID", "ClusterType", "Headline", "Connection", "Members", "Relations", "Summary", "Extra"], "css": "/* ===== WORD GROUP BOARD v2 · Quiet Atlas ===== */\n\n.card ap;\n}\n.wg-number {\n  flex: none;\n  display: inline-flex; align-items: center; justify-content: center;\n  min-width: 26px; height: 22px; border-radius: 7px;\n  background: var(--accent-soft); color: var(--accent);\n  font-size: 11px; font-weight: 800;\n}\n\n/* คำใบ้ไทยเป็นตัวนำของทุกแถว */\n.wg-hint-th {\n  flex: 1 1 200px; min-width: 0;\n  font-size: 17px; font-weight: 650; line-height: 1.6;\n  overflow-wrap: anywhere;\n}\n.wg-hint-th.small {\n  display: block; margin-top: 6px;\n  font-size: 14px; font-weight: 500; color: var(--muted);\n}\n\n.wg-mask {\n  display: flex; flex-wrap: wrap; gap: 9px;\n  margin-top: 10px; min-height: 30px;\n}\n.wg-mask-word { display: inline-flex; flex-wrap: wrap; gap: 3px; max-width: 100%; }\n.wg-letter {\n  display: inline-flex; align-items: center; justify-content: center;\n  width: 20px; height: 28px;\n  border: 1px solid var(--line); border-radius: 5px;\n  background: var(--soft); color: var(--ink);\n  font-family: ui-monospace, Consolas, monospace;\n  font-size: 15px; font-weight: 700;\n}\n.wg-letter.missing {\n  border-style: dashed; border-color: var(--accent);\n  background: var(--accent-soft); color: var(--accent);\n}\n\n.wg-input {\n  display: block; width: 100%; min-height: 42px;\n  padding: 9px 11px;\n  border: 1px solid var(--line); border-radius: 10px;\n  background: var(--soft); color: var(--ink);\n  font-family: ui-monospace, Consolas, monospace; font-size: 16px;\n}\n.wg-input::placeholder { color: var(--muted); opacity: .7; font-size: 13px; }\n.wg-input:focus { border-color: var(--accent); outline: 3px solid var(--accent-soft); }\n.wg-input:disabled { opacity: 1; -webkit-text-fill-color: var(--muted); }\n\n.wg.no-typing .wg-field { display: none; }\n\n.wg-row-tools { display: flex; gap: 6px; flex-wrap: wrap; }\n.wg-small-btn {\n  flex: 1 1 auto; font: inherit; font-size: 12px; cursor: pointer;\n  min-height: 34px; padding: 5px 9px;\n  border: 1px solid transparent; border-radius: 8px;\n  background: var(--accent-soft); color: var(--accent);\n}\n.wg-small-btn.ghost {\n  background: var(--surface); border-color: var(--line); color: var(--muted);\n}\n\n.wg-result { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }\n.wg-result:empty { display: none; }\n.is-good .wg-result { color: var(--green); }\n.is-miss .wg-result { color: var(--amber); }\n\n.wg-solution {\n  grid-column: 1 / -1;\n  margin-top: 2px; padding-top: 9px; border-top: 1px solid var(--line);\n  color: var(--accent); font-size: 20px; font-weight: 800;\n  overflow-wrap: anywhere;\n}\n\n.wg-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }\n.wg-btn {\n  flex: 1 1 150px; font: inherit; cursor: pointer;\n  min-height: 46px; padding: 10px 16px;\n  border: 1px solid var(--line); border-radius: 12px;\n  background: var(--surface); color: var(--ink);\n  font-size: 14px; font-weight: 650;\n}\n.wg-btn.primary { border-color: transparent; background: #5746bc; color: #fff; }\n.wg-btn:focus-visible, .wg-small-btn:focus-visible,\n.wg-mode-btn:focus-visible, .wg summary:focus-visible {\n  outline: 3px solid var(--accent); outline-offset: 3px;\n}\n.wg button:disabled { opacity: .5; cursor: default; }\n\n.wg-status, .wg-error {\n  margin-top: 15px; padding: 12px 15px;\n  border: 1px solid var(--line); border-radius: 12px;\n  background: var(--soft); color: var(--muted); font-size: 13px;\n}\n.wg-error, .wg-status.warning { background: var(--amber-soft); color: var(--amber); }\n\n.wg-answer-row { grid-template-columns: 1fr; }\n.wg-answer-term {\n  color: var(--accent); font-size: 22px; font-weight: 800;\n  overflow-wrap: anywhere;\n}\n.wg-result-badge {\n  padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700;\n}\n.wg-result-badge.good { background: var(--green-soft); color: var(--green); }\n.wg-result-badge.miss { background: var(--amber-soft); color: var(--amber); }\n.wg-your-answer, .wg-hint-note {\n  margin-top: 6px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere;\n}\n.wg-hint-note { color: var(--amber); }\n.wg-note {\n  margin-top: 11px; padding: 11px 12px;\n  border-radius: 10px; background: var(--soft); font-size: 14px;\n}\n.wg-label {\n  display: block; margin-bottom: 5px;\n  color: var(--accent); font-size: 12px; font-weight: 750;\n}\n.wg-example-details { margin-top: 9px; }\n.wg-example-details summary {\n  padding: 6px 0; color: var(--muted); font-size: 12px; cursor: pointer;\n}\n.wg-example { margin-top: 5px; font-size: 15px; line-height: 1.8; }\n.wg-example mark {\n  padding: 0 2px; background: var(--green-soft);\n  color: var(--green); font-weight: 750;\n}\n\n.wg-panel, .wg-summary {\n  margin-top: 18px; padding: 17px 20px;\n  border: 1px solid var(--line); border-radius: 16px;\n  background: var(--surface); overflow-wrap: anywhere;\n}\n.wg-relations { border-left: 4px solid var(--accent); }\n.wg-summary {\n  border-color: transparent; background: var(--green-soft); font-size: 16px;\n}\n.wg-summary .wg-label { color: var(--green); }\n\n.wg-details {\n  margin-top: 13px; overflow: hidden;\n  border: 1px solid var(--line); border-radius: 13px; background: var(--surface);\n}\n.wg-details > summary {\n  min-height: 46px; padding: 12px 15px;\n  color: var(--muted); font-size: 13px; cursor: pointer;\n}\n.wg-details-body { padding: 0 16px 16px; font-size: 14px; overflow-wrap: anywhere; }\n.wg-details-body p { margin: 8px 0 0; }\n.wg-muted { color: var(--muted); font-size: 12px; }\n.wg-foot { margin: 18px 6px 0; color: var(--muted); font-size: 12px; text-align: center; }\n\n@media (max-width: 680px) {\n  .card { padding: 13px 9px 30px; }\n  .wg-hero { padding: 18px 16px; border-radius: 17px; }\n  .wg-hero h1 { font-size: 21px; }\n  .wg-row { grid-template-columns: 1fr; padding: 13px 14px; }\n  .wg-hint-th { font-size: 16px; }\n  .wg-letter { width: 18px; height: 25px; font-size: 14px; }\n  .wg-btn { flex: 1 1 100%; }\n}", "tmpls": [{"name": "Card 1", "front": "{{#Members}}\n<div class=\"wg\" id=\"wg-front\">\n\n  <header class=\"wg-top\">\n    <span class=\"wg-brand\">WORD GROUP / RECALL BOARD<\/span>\n    <span class=\"wg-id\">{{ClusterID}}<\/span>\n  <\/header>\n\n  <section class=\"wg-hero\">\n    <div class=\"wg-meta\">\n      <span class=\"wg-badge\">{{ClusterType}}<\/span>\n      <span class=\"wg-kicker\">เห็นทั้งกลุ่ม · นึกทีละคำ<\/span>\n    <\/div>\n    <h1>{{Headline}}<\/h1>\n    {{#Connection}}\n    <div class=\"wg-connection\">{{Connection}}<\/div>\n    {{/Connection}}\n  <\/section>\n\n  <div class=\"wg-toolbar\">\n    <div class=\"wg-progress\">\n      <span id=\"wg-count\">กรอกแล้ว 0 คำ<\/span>\n      <span class=\"wg-bar\"><i id=\"wg-bar-fill\"><\/i><\/span>\n    <\/div>\n    <button type=\"button\" class=\"wg-mode-btn\" id=\"wg-mode\">\n      ปิดช่องพิมพ์\n    <\/button>\n  <\/div>\n\n  <div class=\"wg-error\" id=\"wg-error\" hidden><\/div>\n  <div class=\"wg-board\" id=\"wg-board\"><\/div>\n\n  <section class=\"wg-controls\">\n    <button type=\"button\" class=\"wg-btn primary\" id=\"wg-check\">\n      ตรวจทั้งกลุ่ม\n    <\/button>\n    <button type=\"button\" class=\"wg-btn\" id=\"wg-show\">\n      เปิดดูทุกคำ\n    <\/button>\n    <button type=\"button\" class=\"wg-btn\" id=\"wg-reset\">\n      ซ่อนและฝึกใหม่\n    <\/button>\n  <\/section>\n\n  <div class=\"wg-status\" id=\"wg-status\" role=\"status\">\n    อ่านคำใบ้ไทยแล้วนึกคำอังกฤษ · กด Enter เพื่อตรวจทีละคำและไปช่องถัดไป\n  <\/div>\n\n  <p class=\"wg-foot\">\n    กดแสดงคำตอบของ Anki เมื่อต้องการดูจุดต่างและสรุปทั้งกลุ่ม\n  <\/p>\n\n  <div id=\"wg-data\" hidden>\n    <div data-id>{{ClusterID}}<\/div>\n    <div data-members>{{Members}}<\/div>\n    <div data-tags>{{Tags}}<\/div>\n  <\/div>\n<\/div>\n\n<script>\n(function () {\n  var root = document.getElementById(\"wg-front\");\n  if (!root || root.dataset.ready) return;\n  root.dataset.ready = \"1\";\n\n  var MAX_MEMBERS = 10;\n  var data = root.querySelector(\"#wg-data\");\n\n  function read(selector) {\n    var n = data.querySelector(selector);\n    if (!n) return \"\";\n    var c = n.cloneNode(true);\n    c.querySelectorAll(\"br\").forEach(function (br) {\n      br.replaceWith(document.createTextNode(\"\\n\"));\n    });\n    c.querySelectorAll(\"div,p,li\").forEach(function (b) {\n      b.appendChild(document.createTextNode(\"\\n\"));\n    });\n    return (c.textContent || \"\").trim();\n  }\n\n  function make(tag, cls, text) {\n    var n = document.createElement(tag);\n    if (cls) n.className = cls;\n    if (text !== undefined) n.textContent = text;\n    return n;\n  }\n\n  /* เทียบแบบยืดหยุ่น ลดการตกเพราะเครื่องหมายหรือช่องว่าง */\n  function norm(s) {\n    return String(s).normalize(\"NFC\").toLowerCase()\n      .replace(/[\\u2018\\u2019]/g, \"'\")\n      .replace(/[^a-z0-9']+/g, \" \")\n      .trim().replace(/\\s+/g, \" \");\n  }\n\n  function storageKey(s) {\n    var h = 2166136261;\n    for (var i = 0; i < s.length; i++) {\n      h = Math.imul(h ^ s.charCodeAt(i), 16777619);\n    }\n    return \"wg-board-v2-\" + (h >>> 0);\n  }\n\n  var raw = read(\"[data-members]\");\n  var signature = read(\"[data-id]\") + \"\\n\" + raw;\n  var key = storageKey(signature);\n  var tags = read(\"[data-tags]\").split(/\\s+/);\n\n  var lines = raw.split(/\\n+/).filter(function (s) { return s.trim(); });\n  var members = [];\n  var errors = [];\n  var seen = Object.create(null);\n\n  lines.forEach(function (line, i) {\n    var p = line.split(\"::\").map(function (s) { return s.trim(); });\n    if (p.length !== 5 || !p[0] || !p[2]) {\n      errors.push(\"บรรทัด \" + (i + 1) + \" ไม่ครบ 5 ส่วน\");\n      return;\n    }\n    if (seen[norm(p[0])]) {\n      errors.push(\"บรรทัด \" + (i + 1) + \" มีคำซ้ำในกลุ่ม\");\n      return;\n    }\n    seen[norm(p[0])] = true;\n    members.push({\n      word: p[0], lane: p[1] || \"สมาชิก\",\n      meaning: p[2], note: p[3], example: p[4]\n    });\n  });\n\n  var overflow = members.length > MAX_MEMBERS;\n  if (overflow) members = members.slice(0, MAX_MEMBERS);\n\n  var error = root.querySelector(\"#wg-error\");\n  var board = root.querySelector(\"#wg-board\");\n  var status = root.querySelector(\"#wg-status\");\n\n  if (errors.length || !members.length) {\n    error.hidden = false;\n    error.textContent = errors.join(\" / \") || \"ไม่พบข้อมูลสมาชิกที่อ่านได้\";\n    root.querySelector(\".wg-controls\").hidden = true;\n    root.querySelector(\".wg-toolbar\").hidden = true;\n    return;\n  }\n\n  if (overflow) {\n    error.hidden = false;\n    error.textContent =\n      \"กลุ่มนี้มีสมาชิกเกิน \" + MAX_MEMBERS +\n      \" คำ แสดงเฉพาะ \" + MAX_MEMBERS + \" คำแรก ควรแตกเป็นสองกลุ่ม\";\n  }\n\n  /* ยิ่งกลุ่มใหญ่ ยิ่งลดภาระการพิมพ์ */\n  var base = tags.indexOf(\"lvl1\") >= 0 ? 0.30 :\n             tags.indexOf(\"lvl3\") >= 0 ? 0.70 : 0.48;\n  var scale = members.length >= 9 ? 0.62 :\n              members.length >= 7 ? 0.74 :\n              members.length >= 5 ? 0.88 : 1;\n  var ratio = base * scale;\n\n  try { sessionStorage.removeItem(key); } catch (e) {}\n\n  var state = {\n    signature: signature, time: Date.now(),\n    answers: members.map(function () { return \"\"; }),\n    hints: members.map(function () { return 0; }),\n    typing: true, exposed: false, retry: false, checked: false\n  };\n\n  function save() {\n    state.time = Date.now();\n    try { sessionStorage.setItem(key, JSON.stringify(state)); } catch (e) {}\n  }\n\n  var rows = [];\n  var lanes = Object.create(null);\n\n  members.forEach(function (m, i) {\n    if (!lanes[m.lane]) {\n      var section = make(\"section\", \"wg-lane\");\n      section.appendChild(make(\"h2\", \"wg-lane-title\", m.lane));\n      var list = make(\"div\", \"wg-list\");\n      section.appendChild(list);\n      board.appendChild(section);\n      lanes[m.lane] = list;\n    }\n\n    var row = make(\"article\", \"wg-row\");\n\n    var left = make(\"div\", \"wg-row-main\");\n    var top = make(\"div\", \"wg-row-top\");\n    top.appendChild(make(\"span\", \"wg-number\", String(i + 1).padStart(2, \"0\")));\n    top.appendChild(make(\"span\", \"wg-hint-th\", m.meaning));\n    left.appendChild(top);\n\n    var mask = make(\"div\", \"wg-mask\");\n    mask.setAttribute(\"aria-label\", \"โครงตัวอักษร\");\n    left.appendChild(mask);\n    row.appendChild(left);\n\n    var side = make(\"div\", \"wg-row-side\");\n\n    var field = make(\"div\", \"wg-field\");\n    var input = make(\"input\", \"wg-input\");\n    input.id = \"wg-entry-\" + i;\n    input.type = \"text\";\n    input.placeholder = \"พิมพ์คำอังกฤษ\";\n    input.autocomplete = \"off\";\n    input.setAttribute(\"autocapitalize\", \"none\");\n    input.setAttribute(\"autocorrect\", \"off\");\n    input.setAttribute(\"spellcheck\", \"false\");\n    input.setAttribute(\"inputmode\", \"latin\");\n    input.setAttribute(\"enterkeyhint\", \"next\");\n    input.setAttribute(\"aria-label\", \"คำที่ \" + (i + 1));\n    field.appendChild(input);\n    side.appendChild(field);\n\n    var tools = make(\"div\", \"wg-row-tools\");\n    var hintBtn = make(\"button\", \"wg-small-btn\", \"ใบ้เพิ่ม\");\n    hintBtn.type = \"button\";\n    var peekBtn = make(\"button\", \"wg-small-btn ghost\", \"ดูคำนี้\");\n    peekBtn.type = \"button\";\n    tools.appendChild(hintBtn);\n    tools.appendChild(peekBtn);\n    side.appendChild(tools);\n\n    row.appendChild(side);\n\n    var result = make(\"div\", \"wg-result\");\n    result.setAttribute(\"role\", \"status\");\n    row.appendChild(result);\n\n    var solution = make(\"div\", \"wg-solution\", m.word);\n    solution.hidden = true;\n    row.appendChild(solution);\n\n    lanes[m.lane].appendChild(row);\n\n    var chars = Array.from(m.word);\n    var eligible = [];\n    chars.forEach(function (c, k) {\n      if (/[A-Za-z]/.test(c)) eligible.push(k);\n    });\n\n    var pool = eligible.slice(1);\n    var total = pool.length ? Math.max(1, Math.round(pool.length * ratio)) : 0;\n    var hidden = [];\n    for (var n = 0; n < total; n++) {\n      hidden.push(pool[Math.floor(n * pool.length / total)]);\n    }\n    if (!hidden.length && eligible.length) {\n      hidden.push(eligible[eligible.length - 1]);\n    }\n\n    var item = {\n      row: row, input: input, result: result, solution: solution,\n      hintBtn: hintBtn, peekBtn: peekBtn, mask: mask,\n      chars: chars, hidden: hidden, done: false\n    };\n    rows.push(item);\n\n    item.renderMask = function () {\n      mask.textContent = \"\";\n      var now = item.hidden.slice(state.hints[i]);\n      var box = null;\n      chars.forEach(function (c, k) {\n        if (/\\s/.test(c)) { box = null; return; }\n        if (!box) { box = make(\"span\", \"wg-mask-word\"); mask.appendChild(box); }\n        var miss = now.indexOf(k) >= 0;\n        box.appendChild(make(\"span\", \"wg-letter\" + (miss ? \" missing\" : \"\"),\n          miss ? \"_\" : c));\n      });\n    };\n    item.renderMask();\n\n    function lockRow(match, typed) {\n      item.done = true;\n      item.solution.hidden = false;\n      item.input.disabled = true;\n      item.hintBtn.disabled = true;\n      item.peekBtn.disabled = true;\n      item.row.classList.remove(\"is-good\", \"is-miss\");\n      item.row.classList.add(match ? \"is-good\" : \"is-miss\");\n      item.result.textContent = match ? \"ตรงกับคำเป้าหมาย\"\n        : typed ? \"ยังไม่ตรงกับคำเป้าหมาย\" : \"เปิดดูคำตอบแล้ว\";\n    }\n    item.lockRow = lockRow;\n\n    input.addEventListener(\"input\", function () {\n      state.answers[i] = input.value;\n      save();\n      updateProgress();\n    });\n\n    input.addEventListener(\"keydown\", function (ev) {\n      if (ev.key !== \"Enter\") return;\n      ev.preventDefault();\n      ev.stopPropagation();\n      if (!item.done && input.value.trim()) {\n        lockRow(norm(input.value) === norm(m.word), true);\n        save();\n      }\n      var next = rows.slice(i + 1).filter(function (r) { return !r.done; })[0];\n      if (next) next.input.focus();\n      else root.querySelector(\"#wg-check\").focus();\n      updateProgress();\n    });\n\n    hintBtn.addEventListener(\"click\", function () {\n      if (state.hints[i] < item.hidden.length - 1) {\n        state.hints[i]++;\n        item.renderMask();\n        save();\n        status.textContent = \"เปิดใบ้เพิ่มแล้ว · ผลด้านหลังจะระบุว่ามีตัวช่วย\";\n      } else {\n        status.textContent = \"คำนี้เปิดใบ้ได้เท่านี้ ลองกดดูคำนี้แทนครับ\";\n      }\n    });\n\n    peekBtn.addEventListener(\"click\", function () {\n      state.exposed = true;\n      lockRow(norm(state.answers[i] || \"\") === norm(m.word),\n        !!(state.answers[i] || \"\").trim());\n      save();\n      updateProgress();\n    });\n  });\n\n  function updateProgress() {\n    var filled = state.answers.filter(function (s) { return s.trim(); }).length;\n    var done = rows.filter(function (r) { return r.done; }).length;\n    var shown = Math.max(filled, done);\n    root.querySelector(\"#wg-count\").textContent =\n      \"ทำแล้ว \" + shown + \" จาก \" + members.length + \" คำ\";\n    root.querySelector(\"#wg-bar-fill\").style.width =\n      Math.round(shown / members.length * 100) + \"%\";\n  }\n\n  function finish(check) {\n    var correct = 0;\n    rows.forEach(function (r, i) {\n      var typed = String(state.answers[i] || \"\");\n      var match = norm(typed) === norm(members[i].word);\n      if (match) correct++;\n      r.solution.hidden = false;\n      r.input.disabled = true;\n      r.hintBtn.disabled = true;\n      r.peekBtn.disabled = true;\n      r.row.classList.remove(\"is-good\", \"is-miss\");\n      if (check) {\n        r.row.classList.add(match ? \"is-good\" : \"is-miss\");\n        r.result.textContent = match ? \"ตรงกับคำเป้าหมาย\"\n          : typed.trim() ? \"ยังไม่ตรงกับคำเป้าหมาย\" : \"ยังไม่ได้ตอบ\";\n      } else {\n        r.result.textContent = \"โหมดอ่านภาพรวม\";\n      }\n      r.done = true;\n    });\n\n    state.checked = check;\n    state.exposed = true;\n    save();\n\n    root.querySelector(\"#wg-check\").disabled = true;\n    root.querySelector(\"#wg-show\").disabled = true;\n\n    status.textContent = check\n      ? \"พิมพ์ตรง \" + correct + \" จาก \" + members.length +\n        \" คำ · เป็นผลเทียบข้อความ ไม่ใช่คะแนนความเข้าใจ\"\n      : \"เปิดดูทุกคำแล้ว · อ่านความเชื่อมโยง แล้วกดซ่อนเพื่อฝึกซ้ำได้\";\n    updateProgress();\n  }\n\n  root.querySelector(\"#wg-check\").addEventListener(\"click\", function () {\n    finish(true);\n  });\n  root.querySelector(\"#wg-show\").addEventListener(\"click\", function () {\n    finish(false);\n  });\n\n  root.querySelector(\"#wg-reset\").addEventListener(\"click\", function () {\n    state.retry = true;\n    state.checked = false;\n    state.answers = members.map(function () { return \"\"; });\n    state.hints = members.map(function () { return 0; });\n    rows.forEach(function (r) {\n      r.done = false;\n      r.input.disabled = false;\n      r.input.value = \"\";\n      r.hintBtn.disabled = false;\n      r.peekBtn.disabled = false;\n      r.solution.hidden = true;\n      r.result.textContent = \"\";\n      r.row.classList.remove(\"is-good\", \"is-miss\");\n      r.renderMask();\n    });\n    root.querySelector(\"#wg-check\").disabled = false;\n    root.querySelector(\"#wg-show\").disabled = false;\n    status.textContent = \"เริ่มฝึกซ้ำแล้ว · รอบนี้ไม่ใช่การนึกครั้งแรกของการ์ด\";\n    updateProgress();\n    save();\n  });\n\n  /* โหมดไม่พิมพ์ สำหรับกลุ่มใหญ่หรือทบทวนบนมือถือ */\n  var modeBtn = root.querySelector(\"#wg-mode\");\n  modeBtn.addEventListener(\"click\", function () {\n    state.typing = !state.typing;\n    root.classList.toggle(\"no-typing\", !state.typing);\n    modeBtn.textContent = state.typing ? \"ปิดช่องพิมพ์\" : \"เปิดช่องพิมพ์\";\n    status.textContent = state.typing\n      ? \"เปิดโหมดพิมพ์แล้ว\"\n      : \"ปิดช่องพิมพ์แล้ว · นึกในใจ แล้วกดดูคำนี้หรือเปิดดูทุกคำ\";\n    save();\n  });\n\n  if (tags.indexOf(\"notype\") >= 0) modeBtn.click();\n\n  updateProgress();\n  save();\n})();\n<\/script>\n{{/Members}}", "back": "{{#Members}}\n<div class=\"wg\" id=\"wg-back\">\n\n  <header class=\"wg-top\">\n    <span class=\"wg-brand\">WORD GROUP / CONNECTION MAP<\/span>\n    <span class=\"wg-id\">{{ClusterID}}<\/span>\n  <\/header>\n\n  <section class=\"wg-hero\">\n    <div class=\"wg-meta\">\n      <span class=\"wg-badge\">{{ClusterType}}<\/span>\n      <span class=\"wg-kicker\">เฉลยทั้งกลุ่ม<\/span>\n    <\/div>\n    <h1>{{Headline}}<\/h1>\n    {{#Connection}}\n    <div class=\"wg-connection\">{{Connection}}<\/div>\n    {{/Connection}}\n  <\/section>\n\n  <div class=\"wg-status\" id=\"wg-review-status\"><\/div>\n  <div class=\"wg-board\" id=\"wg-answer-board\"><\/div>\n\n  {{#Relations}}\n  <section class=\"wg-panel wg-relations\">\n    <div class=\"wg-label\">ความสัมพันธ์ที่ควรจำ<\/div>\n    <div>{{Relations}}<\/div>\n  <\/section>\n  {{/Relations}}\n\n  {{#Summary}}\n  <section class=\"wg-summary\">\n    <div class=\"wg-label\">จำทั้งกลุ่มด้วยประโยคนี้<\/div>\n    <div>{{Summary}}<\/div>\n  <\/section>\n  {{/Summary}}\n\n  <details class=\"wg-details\">\n    <summary>ให้คะแนนการ์ดกลุ่มอย่างไร<\/summary>\n    <div class=\"wg-details-body\">\n      <p><b>Again<\/b> ขาดสมาชิกสำคัญหลายคำ หรือจำความสัมพันธ์ผิด<\/p>\n      <p><b>Hard<\/b> นึกได้เกือบครบ แต่ต้องใช้ความพยายามมาก<\/p>\n      <p><b>Good<\/b> นึกสมาชิกและความสัมพันธ์ได้ตามปกติ<\/p>\n      <p><b>Easy<\/b> ทั้งกลุ่มง่ายมากสำหรับคุณ<\/p>\n      <p class=\"wg-muted\">\n        คะแนนนี้เป็นของทั้งกลุ่ม ไม่ใช่ของแต่ละคำ\n        ถ้าเปิดเฉลยหรือฝึกซ้ำ ให้ยึดสิ่งที่นึกได้ก่อนเห็นเฉลย\n        สะกดคลาดเล็กน้อยกับลืมสมาชิกไม่ใช่เรื่องเดียวกัน\n      <\/p>\n    <\/div>\n  <\/details>\n\n  {{#Extra}}\n  <details class=\"wg-details\">\n    <summary>สถานะการ์ดเดิมและข้อมูลเพิ่มเติม<\/summary>\n    <div class=\"wg-details-body\">{{Extra}}<\/div>\n  <\/details>\n  {{/Extra}}\n\n  <p class=\"wg-foot\">\n    ก่อนเลื่อนไป ลองพูดสั้น ๆ ว่าคำกลุ่มนี้เกี่ยวข้องกันอย่างไร\n  <\/p>\n\n  <div id=\"wg-back-data\" hidden>\n    <div data-id>{{ClusterID}}<\/div>\n    <div data-members>{{Members}}<\/div>\n  <\/div>\n<\/div>\n\n<script>\n(function () {\n  var root = document.getElementById(\"wg-back\");\n  if (!root || root.dataset.ready) return;\n  root.dataset.ready = \"1\";\n\n  var MAX_MEMBERS = 10;\n  var data = root.querySelector(\"#wg-back-data\");\n\n  function read(selector) {\n    var n = data.querySelector(selector);\n    if (!n) return \"\";\n    var c = n.cloneNode(true);\n    c.querySelectorAll(\"br\").forEach(function (br) {\n      br.replaceWith(document.createTextNode(\"\\n\"));\n    });\n    c.querySelectorAll(\"div,p,li\").forEach(function (b) {\n      b.appendChild(document.createTextNode(\"\\n\"));\n    });\n    return (c.textContent || \"\").trim();\n  }\n\n  function make(tag, cls, text) {\n    var n = document.createElement(tag);\n    if (cls) n.className = cls;\n    if (text !== undefined) n.textContent = text;\n    return n;\n  }\n\n  function norm(s) {\n    return String(s).normalize(\"NFC\").toLowerCase()\n      .replace(/[\\u2018\\u2019]/g, \"'\")\n      .replace(/[^a-z0-9']+/g, \" \")\n      .trim().replace(/\\s+/g, \" \");\n  }\n\n  function storageKey(s) {\n    var h = 2166136261;\n    for (var i = 0; i < s.length; i++) {\n      h = Math.imul(h ^ s.charCodeAt(i), 16777619);\n    }\n    return \"wg-board-v2-\" + (h >>> 0);\n  }\n\n  function highlighted(text) {\n    var box = make(\"div\", \"wg-example\");\n    text.split(/(\\*[^*]+\\*)/g).forEach(function (part) {\n      if (/^\\*[^*]+\\*$/.test(part)) {\n        box.appendChild(make(\"mark\", \"\", part.slice(1, -1)));\n      } else {\n        box.appendChild(document.createTextNode(part));\n      }\n    });\n    return box;\n  }\n\n  var raw = read(\"[data-members]\");\n  var signature = read(\"[data-id]\") + \"\\n\" + raw;\n  var key = storageKey(signature);\n  var members = [];\n  var malformed = false;\n\n  raw.split(/\\n+/).filter(function (s) { return s.trim(); })\n    .forEach(function (line) {\n      var p = line.split(\"::\").map(function (s) { return s.trim(); });\n      if (p.length !== 5 || !p[0] || !p[2]) { malformed = true; return; }\n      members.push({\n        word: p[0], lane: p[1] || \"สมาชิก\",\n        meaning: p[2], note: p[3], example: p[4]\n      });\n    });\n\n  var overflow = members.length > MAX_MEMBERS;\n  if (overflow) members = members.slice(0, MAX_MEMBERS);\n\n  var state = null;\n  try {\n    var saved = sessionStorage.getItem(key);\n    sessionStorage.removeItem(key);\n    if (saved) {\n      var c = JSON.parse(saved);\n      var age = Date.now() - c.time;\n      if (c.signature === signature && age >= 0 &&\n          age < 4 * 60 * 60 * 1000 &&\n          Array.isArray(c.answers) && c.answers.length === members.length) {\n        state = c;\n      }\n    }\n  } catch (e) {}\n\n  var board = root.querySelector(\"#wg-answer-board\");\n  var status = root.querySelector(\"#wg-review-status\");\n  var lanes = Object.create(null);\n  var correct = 0;\n  var typedAny = false;\n\n  members.forEach(function (m, i) {\n    if (!lanes[m.lane]) {\n      var section = make(\"section\", \"wg-lane\");\n      section.appendChild(make(\"h2\", \"wg-lane-title\", m.lane));\n      var list = make(\"div\", \"wg-list\");\n      section.appendChild(list);\n      board.appendChild(section);\n      lanes[m.lane] = list;\n    }\n\n    var row = make(\"article\", \"wg-row wg-answer-row\");\n\n    var head = make(\"div\", \"wg-row-top\");\n    head.appendChild(make(\"span\", \"wg-number\", String(i + 1).padStart(2, \"0\")));\n    head.appendChild(make(\"span\", \"wg-answer-term\", m.word));\n\n    if (state) {\n      var typed = String(state.answers[i] || \"\");\n      if (typed.trim()) typedAny = true;\n      var match = norm(typed) === norm(m.word);\n      if (match) correct++;\n      head.appendChild(make(\"span\",\n        \"wg-result-badge \" + (match ? \"good\" : \"miss\"),\n        match ? \"ตรง\" : typed.trim() ? \"ยังไม่ตรง\" : \"ไม่ได้ตอบ\"));\n      row.classList.add(match ? \"is-good\" : \"is-miss\");\n    }\n\n    row.appendChild(head);\n    row.appendChild(make(\"div\", \"wg-hint-th small\", m.meaning));\n\n    if (state) {\n      var t = String(state.answers[i] || \"\");\n      row.appendChild(make(\"div\", \"wg-your-answer\",\n        \"คุณพิมพ์: \" + (t.trim() || \"ไม่ได้พิมพ์\")));\n      if (state.hints && state.hints[i] > 0) {\n        row.appendChild(make(\"div\", \"wg-hint-note\", \"มีการเปิดใบ้เพิ่ม\"));\n      }\n    }\n\n    if (m.note) {\n      var note = make(\"div\", \"wg-note\");\n      note.appendChild(make(\"span\", \"wg-label\", \"จุดต่าง / วิธีใช้\"));\n      note.appendChild(make(\"div\", \"\", m.note));\n      row.appendChild(note);\n    }\n\n    if (m.example) {\n      var det = make(\"details\", \"wg-example-details\");\n      det.appendChild(make(\"summary\", \"\", \"ดูประโยคตัวอย่าง\"));\n      det.appendChild(highlighted(m.example));\n      row.appendChild(det);\n    }\n\n    lanes[m.lane].appendChild(row);\n  });\n\n  if (malformed || !members.length) {\n    status.textContent =\n      \"ข้อมูล Members บางบรรทัดไม่ครบ 5 ส่วน กรุณาแก้ข้อมูลก่อนใช้ทบทวน\";\n    status.classList.add(\"warning\");\n  } else if (state) {\n    var tail = state.retry ? \" · มีการฝึกซ้ำในรอบนี้\"\n      : state.exposed ? \" · มีการเปิดเฉลยบนหน้าการ์ดแล้ว\" : \"\";\n    if (!state.typing && !typedAny) {\n      status.textContent =\n        \"ทบทวนในโหมดไม่พิมพ์ · ให้คะแนนจากสิ่งที่นึกได้เอง\" + tail;\n    } else {\n      status.textContent =\n        \"พิมพ์ตรง \" + correct + \" จาก \" + members.length + \" คำ\" + tail;\n    }\n  } else {\n    status.textContent =\n      \"แสดงเฉลยทั้งกลุ่ม · ไม่มีผลการพิมพ์ส่งต่อมาถึงหน้านี้\";\n  }\n\n  if (overflow) {\n    status.textContent += \" · กลุ่มนี้มีสมาชิกเกิน \" + MAX_MEMBERS + \" คำ\";\n  }\n})();\n<\/script>\n{{/Members}}"}]}, {"name": "Image Occlusion", "notes": 0, "fields": ["Occlusion", "Image", "Header", "Back Extra", "Comments"], "css": "#image-occlusion-canvas {\n    --inactive-shape-color: #ffeba2;\n    --active-shape-color: #ff8e8e;\
