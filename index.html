"Segoe UI\",Roboto,\"Noto Sans Thai\",\"Leelawadee UI\",Tahoma,sans-serif;\n  -webkit-text-size-adjust:100%;\n}\n.nightMode.card,.night_mode.card,.nightMode .card,.night_mode .card{\n  --bg:#12151c; --surface:#1b212b; --text:#e8ecf5; --sub:#9ba8be; --line:#2c3441;\n  --good:#4ade9b; --good-bg:rgba(74,222,155,.14);\n  --bad:#ff8f84;  --bad-bg:rgba(255,143,132,.14);\n  --sel:#8aa9ff;  --sel-bg:rgba(138,169,255,.16);\n  --rule:#f5c451; --rule-bg:rgba(245,196,81,.12);\n}\n\n.wrap{max-width:720px;margin:0 auto}\n.meta{font-size:13px;color:var(--sub);margin:0 0 14px}\n.lbl{font-size:13px;font-weight:700;color:var(--sub)}\n\n/* โจทย์ + ตัวเลือก */\n.q{font-size:19.5px;line-height:1.85}\n.q img{max-width:100%;height:auto}\n.opt{margin:9px 0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;\n  background:var(--surface);-webkit-tap-highlight-color:transparent;touch-action:manipulation}\n.front .opt{cursor:pointer}\n.opt.sel{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel);background:var(--sel-bg)}\n.opt.right{border-color:var(--good);box-shadow:0 0 0 1px var(--good);background:var(--good-bg)}\n.opt.wrong{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad);background:var(--bad-bg)}\n.opt.right::after{content:\" ✓\";color:var(--good);font-weight:700}\n.opt.wrong::after{content:\" ✕\";color:var(--bad);font-weight:700}\n\n/* หน้าเฉลย: เฉลย → กฎ → (เหตุผลพับไว้) → โจทย์ */\n.back .q{font-size:17px;line-height:1.8}\n.qh{margin:30px 0 6px}\n\n.ans{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}\n.ans-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}\n.chip{font-size:13.5px;font-weight:700;padding:3px 11px;border-radius:99px}\n.chip:empty{display:none}\n.chip.ok{color:var(--good);background:var(--good-bg)}\n.chip.no{color:var(--bad);background:var(--bad-bg)}\n.ans-main{display:flex;align-items:center;gap:12px}\n.k{flex:none;box-sizing:border-box;min-width:44px;height:44px;padding:0 12px;\n  display:flex;align-items:center;justify-content:center;border-radius:10px;\n  background:var(--good);color:var(--surface);font-size:22px;font-weight:800;line-height:1}\n.t{font-size:19px;font-weight:600;line-height:1.5}\n\n.exp{margin-top:16px;font-size:17.5px;line-height:1.85}\n.rule{padding:14px 16px;border-left:4px solid var(--rule);border-radius:4px 12px 12px 4px;\n  background:var(--rule-bg);font-size:18.5px;font-weight:600;line-height:1.7}\n.why{margin-top:8px}\n.why>summary{cursor:pointer;list-style:none;padding:8px 2px;color:var(--sub);\n  font-size:14.5px;font-weight:600;-webkit-tap-highlight-color:transparent}\n.why>summary::-webkit-details-marker{display:none}\n.why>summary::before{content:\"▸  \"}\n.why[open]>summary::before{content:\"▾  \"}\n.exp ul{margin:6px 0;padding-left:1.2em}\n\n.ref{margin-top:16px;font-size:14.5px;color:var(--sub)}\n\n@media (max-width:480px){\n  .card{padding:12px 12px 28px;font-size:17.5px}\n  .q{font-size:19px}\n}", "tmpls": [{"name": "Card 1", "front": "<div class=\"wrap front\">\n  <div class=\"meta\">{{ExamSet}}<\/div>\n  <div class=\"q\" id=\"q\">{{Question}}<\/div>\n<\/div>\n\n<script>\n(function () {\n  var q = document.getElementById('q');\n  var opts = q ? q.querySelectorAll('.opt') : [];\n  if (!opts.length) return;\n\n  function sig(s) {\n    s = (s || '').replace(/\\s+/g, ' ');\n    for (var i = 0, h = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;\n    return String(h);\n  }\n  var id = sig(q.textContent);\n\n  window.__elPick = '';\n  try { sessionStorage.removeItem('el_pick'); } catch (e) {}\n\n  Array.prototype.forEach.call(opts, function (el, i) {\n    var k = el.getAttribute('data-k') || String.fromCharCode(65 + i);\n    el.setAttribute('role', 'button');\n    el.onclick = function () {\n      Array.prototype.forEach.call(opts, function (o) { o.classList.remove('sel'); });\n      el.classList.add('sel');\n      var v = id + '|' + k;\n      window.__elPick = v;\n      try { sessionStorage.setItem('el_pick', v); } catch (e) {}\n    };\n  });\n})();\n<\/script>", "back": "<div class=\"wrap back\">\n  <div class=\"meta\">{{ExamSet}}<\/div>\n\n  <div class=\"ans\">\n    <div class=\"ans-head\"><span class=\"lbl\">เฉลย<\/span><span class=\"chip\" id=\"chip\"><\/span><\/div>\n    <div class=\"ans-main\"><span class=\"k\" id=\"ansK\">{{Answer}}<\/span><span class=\"t\" id=\"ansT\"><\/span><\/div>\n  <\/div>\n\n  <div class=\"exp\">{{Explanation}}<\/div>\n\n  {{#GrammarRef}}<div class=\"ref\">📘 ทวนเพิ่มในไฟล์ Grammar: {{GrammarRef}}<\/div>{{/GrammarRef}}\n\n  <div class=\"lbl qh\">โจทย์<\/div>\n  <div class=\"q\" id=\"q\">{{Question}}<\/div>\n<\/div>\n\n<script>\n(function () {\n  var q = document.getElementById('q'), kEl = document.getElementById('ansK');\n  var opts = q ? q.querySelectorAll('.opt') : [];\n  if (!kEl || !opts.length) return;\n\n  var ans = (kEl.textContent || '').replace(/\\s+/g, '').toUpperCase();\n\n  function sig(s) {\n    s = (s || '').replace(/\\s+/g, ' ');\n    for (var i = 0, h = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;\n    return String(h);\n  }\n  var id = sig(q.textContent);\n\n  /* อ่านค่าที่แตะไว้จากหน้าหน้า: ตัวแปร window ก่อน แล้วค่อย sessionStorage (ไม่มี = เงียบ ๆ) */\n  var raw = window.__elPick || '';\n  if (!raw) { try { raw = sessionStorage.getItem('el_pick') || ''; } catch (e) {} }\n  var pick = raw.indexOf(id + '|') === 0 ? raw.slice(id.length + 1) : '';\n\n  Array.prototype.forEach.call(opts, function (el, i) {\n    var k = el.getAttribute('data-k') || String.fromCharCode(65 + i);\n    if (k === ans) {\n      el.classList.add('right');\n      document.getElementById('ansT').textContent = (el.textContent || '').replace(/^\\s*[A-Z]\\.\\s*/, '');\n    } else if (k === pick) {\n      el.classList.add('wrong');\n    }\n  });\n\n  if (pick) {\n    var chip = document.getElementById('chip'), ok = pick === ans;\n    chip.textContent = ok ? '✅ ตอบถูก' : '❌ เลือก ' + pick;\n    chip.className = 'chip ' + (ok ? 'ok' : 'no');\n  }\n})();\n<\/script>"}]}, {"name": "SelfDev Idea", "notes": 0, "fields": ["Question", "Answer", "Kind", "Title", "Steps", "Why", "Example", "Action", "Caveat", "Evidence", "Think_Q", "Think_A", "Source"], "css": "@import url(\"https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap\");\n\n/* ============================================================\n   SelfDev · Gilt & Cloth\n   ปกผ้าสีกรมท่า ปั๊มทองเปลว\n   ทอง = โครงสร้าง (เส้น ชื่อ ตัวเลข)   สีอื่นมีความหมายเดียว\n   เขียว ลงมือทำ | น้ำเงิน โมเดล | ม่วง คิดวิเคราะห์ | ส้มชมพู ข้อควรระวัง\n   ============================================================ */\n\n:root{\n  --cloth:#0B1630;\n  --gilt:#E3C070; --gilt-lite:#F6E2A0;\n  --ivory:#F2EDE0; --soft:#DCE3F2; --slate:#AEB8CE; --mist:#7E8AA5;\n  --emerald:#5ED6AA; --sapphire:#86B7FF; --amethyst:#C0A8FF; --coral:#F4A08F; --steel:#9FB0D4;\n  --f-body:\"Sarabun\",\"Noto Sans Thai\",\"Noto Sans Thai UI\",\"Sukhumvit Set\",\"Thonburi\",\"Leelawadee UI\",\"Tahoma\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --f-serif:\"Noto Serif Thai\",\"Thonburi\",\"Georgia\",\"Times New Roman\",serif;\n}\n\n/* ---------- หน้ากระดาษ ---------- */\nhtml,body{margin:0;padding:0;background-color:var(--cloth)}\n.card{\n  margin:0;min-height:100vh;\n  font-family:var(--f-body);font-size:17px;line-height:1.8;color:var(--ivory);text-align:left;\n  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;\n  background-color:var(--cloth);\n  background-image:\n    linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 300px),\n    repeating-linear-gradient(0deg,rgba(255,255,255,.009) 0 1px,transparent 1px 5px),\n    repeating-linear-gradient(90deg,rgba(255,255,255,.006) 0 1px,transparent 1px 5px);\n}\n::selection{background:rgba(227,192,112,.32);color:#fff}\n\n.wrap{--a:var(--gilt);--a-rgb:227,192,112;box-sizing:border-box;max-width:680px;margin:0 auto;padding:0 20px}\n.wrap.f{padding-top:22px}\n.wrap.b{padding-bottom:calc(44px + env(safe-area-inset-bottom,0px))}\n.k-concept{--a:var(--gilt);--a-rgb:227,192,112}\n.k-action{--a:var(--emerald);--a-rgb:94,214,170}\n.k-framework{--a:var(--sapphire);--a-rgb:134,183,255}\n.th{--a:var(--amethyst);--a-rgb:192,168,255}\n\n/* ---------- ป้ายสันปก (ชนิดการ์ด) ---------- */\n.top{margin:0 0 12px}\n.chip{display:none;padding:1px 11px 1px 10px;border:1px solid rgba(var(--a-rgb),.55);border-radius:2px;background:rgba(var(--a-rgb),.07);color:var(--a);font-size:12.5px;font-weight:600;line-height:1.75;letter-spacing:.03em}\n.chip::before{content:\"\";display:inline-block;width:5px;height:5px;margin:0 8px 2px 0;background:var(--a);transform:rotate(45deg)}\n.k-concept .chip,.k-action .chip,.k-framework .chip,.th .chip,.qt .chip{display:inline-block}\n.k-concept .chip::after{content:\"แนวคิด\"}\n.k-action .chip::after{content:\"ลงมือทำ\"}\n.k-framework .chip::after{content:\"โมเดล\"}\n.th .chip::after{content:\"คิดวิเคราะห์\"}\n.qt .chip::after{content:\"คำคม\"}\n\n/* ---------- เส้นเวลาคิด (กันกดข้าม): เต็มแล้วเปลี่ยนเป็นเขียว ---------- */\n.timer{position:relative;height:2px;margin:0 0 22px;border-radius:2px;background:rgba(var(--a-rgb),.16);overflow:hidden}\n.timer i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(var(--a-rgb),.4),var(--a));animation:sd-fill var(--d,4s) linear forwards}\n.timer i::after{content:\"\";position:absolute;left:0;right:0;top:0;bottom:0;background:var(--emerald);opacity:0;animation:sd-go .5s ease var(--d,4s) forwards}\n.hint{position:relative;height:22px;margin:26px 0 34px;font-size:13px;line-height:22px;color:var(--mist)}\n.hint span{position:absolute;left:0;top:0;white-space:nowrap}\n.hint .wait{animation:sd-out .3s ease var(--d,4s) forwards}\n.hint .go{opacity:0;color:var(--emerald);font-weight:600;animation:sd-go .5s ease var(--d,4s) forwards}\n@keyframes sd-fill{to{width:100%}}\n@keyframes sd-go{to{opacity:1}}\n@keyframes sd-out{to{opacity:0}}\n\n/* ---------- โจทย์ ---------- */\n.q{margin:0;font-family:var(--f-serif);font-weight:600;font-size:23px;line-height:1.65;color:#FBF6E8}\n\n/* ---------- ช่วงเฉลย: เส้นทองวาดออกจากกลาง แล้วเนื้อหาค่อยขึ้น (ครั้งเดียว) ---------- */\n.rule{display:flex;align-items:center;gap:14px;margin:28px 0 24px;animation:sd-draw .6s cubic-bezier(.2,.8,.2,1) both}\n.rule::before,.rule::after{content:\"\";flex:1;height:1px}\n.rule::before{background:linear-gradient(90deg,rgba(227,192,112,0),rgba(227,192,112,.7))}\n.rule::after{background:linear-gradient(270deg,rgba(227,192,112,0),rgba(227,192,112,.7))}\n.rule i{width:7px;height:7px;background:var(--gilt);transform:rotate(45deg);box-shadow:0 0 10px rgba(227,192,112,.55)}\n.reveal{animation:sd-rise .5s ease .12s both}\n@keyframes sd-draw{from{transform:scaleX(.05);opacity:0}to{transform:none;opacity:1}}\n@keyframes sd-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n\n/* ---------- บันทึกต่อท้าย (ป้ายอยู่บรรทัดเดียวกับเนื้อหา) ---------- */\n.r{margin:14px 0 0;font-size:16.5px;line-height:1.85;color:var(--soft)}\n.r .lb{margin-right:.6em;font-weight:700;color:var(--c,var(--gilt))}\n.why{--c:var(--gilt)}\n.ex{--c:var(--sapphire)}\n\n.src{margin-top:28px;padding-top:12px;border-top:1px solid rgba(227,192,112,.18);font-size:12.5px;line-height:1.7;color:var(--mist)}\n.src::before{content:\"อ้างอิง\";margin-right:.7em;font-weight:600;color:rgba(227,192,112,.8)}\n\n/* ---------- ตัวอักษรในช่อง ---------- */\nb,strong{color:var(--gilt-lite);font-weight:600}\nem{color:#BCD0F5}\n.card a{color:var(--gilt)}\n.card img{max-width:100%;height:auto;border-radius:8px}\n.card code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;padding:.08em .4em;border-radius:4px;background:rgba(255,255,255,.08)}\n.r ul,.r ol,.ans ul,.ans ol{margin:.35em 0;padding-left:1.3em}\n.card li::marker{color:var(--gilt)}\n\n/* ตัวอักษรหัวเรื่องแบบทองเปลว (ถ้าเครื่องไม่รองรับ จะใช้สีทองเรียบแทน) */\n@supports ((-webkit-background-clip:text) or (background-clip:text)){\n  .ttl,.qt .quote::before{\n    background-image:linear-gradient(100deg,#B98A33 0%,#F6E2A0 36%,#D5A94E 64%,#F3DA92 100%);\n    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;\n  }\n}\n\n@media (max-width:480px){\n  .card{font-size:16.5px}\n  .wrap{padding:0 16px}\n  .q{font-size:21.5px}\n}\n@media (prefers-reduced-motion:reduce){\n  .rule,.reveal,.ev i{animation:none}\n  .timer i{animation:none;width:100%}\n  .timer i::after{animation:none;opacity:1}\n  .hint .wait{animation:none;opacity:0}\n  .hint .go{animation:none;opacity:1}\n}\n\n/* ===== SelfDev Idea : ส่วนเฉพาะของการ์ดแนวคิด / ลงมือทำ / โมเดล / คิดวิเคราะห์ ===== */\n\n/* ชื่อแนวคิด + ริบบิ้นระดับหลักฐาน (ยิ่งยาว ยิ่งน่าเชื่อ) */\n.head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:6px 16px;margin:0 0 8px}\n.head:empty{display:none}\n.ttl{font-family:var(--f-serif);font-weight:700;font-size:15.5px;line-height:1.6;color:var(--gilt)}\n.th .ttl{margin:0 0 6px;font-size:14.5px}\n\n.ev{display:none;align-items:flex-start;gap:9px;color:var(--ev)}\n.ev i{display:block;width:10px;height:20px;background:var(--ev);-webkit-clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);transform-origin:50% 0;animation:sd-unroll .7s cubic-bezier(.2,.9,.25,1) .25s both}\n.ev b{font-size:12.5px;font-weight:600;line-height:1.5;padding-top:1px;color:var(--ev)}\n.ev-strong,.ev-mixed,.ev-weak,.ev-opinion{display:inline-flex}\n.ev-strong{--ev:var(--emerald)}  .ev-strong i{height:26px}  .ev-strong b::after{content:\"หลักฐานหนักแน่น\"}\n.ev-mixed{--ev:#EBC26B}          .ev-mixed i{height:20px}   .ev-mixed b::after{content:\"หลักฐานผสม\"}\n.ev-weak{--ev:var(--coral)}      .ev-weak i{height:15px}    .ev-weak b::after{content:\"หลักฐานอ่อน\"}\n.ev-opinion{--ev:var(--steel)}   .ev-opinion i{height:11px} .ev-opinion b::after{content:\"ความเห็นผู้เขียน\"}\n@keyframes sd-unroll{from{transform:scaleY(.08);opacity:0}to{transform:none;opacity:1}}\n\n/* คำตอบหลัก */\n.ans{margin:0;font-size:20px;font-weight:500;line-height:1.75;color:#FFF8E6}\n\n/* ขั้นตอนของโมเดล: เป็นลำดับจริง จึงใช้เลขและเส้นเชื่อม */\n.steps ol{list-style:none;counter-reset:sd;margin:18px 0 2px;padding:0}\n.steps li{counter-increment:sd;position:relative;margin:0;padding:3px 0 14px 44px;font-size:16.5px;line-height:1.8;color:var(--soft)}\n.steps li::before{content:counter(sd);position:absolute;left:0;top:2px;width:29px;height:29px;border-radius:50%;text-align:center;font:700 14px/29px var(--f-serif);color:#1B1406;background:linear-gradient(135deg,#F6E2A0,#CFA145);box-shadow:0 0 0 3px rgba(227,192,112,.13)}\n.steps li:not(:last-child)::after{content:\"\";position:absolute;left:14px;top:35px;bottom:3px;width:1px;background:rgba(227,192,112,.3)}\n\n/* ลงมือทำ = กล่องเดียวของการ์ด / ข้อควรระวัง = เส้นประ */\n.r.act{margin-top:18px;padding:13px 16px;border:1px solid rgba(94,214,170,.32);border-radius:10px;background:rgba(94,214,170,.075);color:#E4F6EE}\n.act{--c:var(--emerald)}\n.cav{--c:var(--coral);padding-left:14px;border-left:2px dashed rgba(244,160,143,.7)}\n\n/* การ์ดคิดวิเคราะห์ */\n.lens{display:flex;flex-wrap:wrap;gap:6px 0;margin:20px 0 0}\n.lens span{padding:0 13px;border-left:1px solid rgba(192,168,255,.4);font-size:13px;line-height:1.5;color:var(--slate)}\n.lens span:first-child{padding-left:0;border-left:0}\n.tans p{margin:0 0 12px}\n.tans p:last-child{margin:0}\n.tans{padding-left:16px;border-left:2px solid rgba(192,168,255,.65);font-size:17.5px;line-height:1.9;color:var(--ivory)}", "tmpls": [{"name": "Recall", "front": "{{#Question}}\n<div class=\"wrap f k-{{Kind}}\" style=\"--d:4s\">\n  <div class=\"top\"><span class=\"chip\"><\/span><\/div>\n  <div class=\"timer\"><i><\/i><\/div>\n  <div class=\"q\">{{Question}}<\/div>\n  <div class=\"hint\"><span class=\"wait\">ลองนึกคำตอบก่อนพลิก<\/span><span class=\"go\">พร้อมเฉลยแล้ว<\/span><\/div>\n<\/div>\n{{/Question}}", "back": "{{FrontSide}}\n<style>.timer,.hint{display:none}.q{font-size:19px;line-height:1.6;font-weight:500;color:var(--slate)}<\/style>\n\n<div class=\"wrap b k-{{Kind}}\">\n  <div id=\"answer\" class=\"rule\"><i><\/i><\/div>\n\n  <div class=\"reveal\">\n    <div class=\"head\">{{#Title}}<div class=\"ttl\">{{Title}}<\/div>{{/Title}}{{#Evidence}}<div class=\"ev ev-{{Evidence}}\"><i><\/i><b><\/b><\/div>{{/Evidence}}<\/div>\n\n    <div class=\"ans\">{{Answer}}<\/div>\n\n    {{#Steps}}<div class=\"steps\">{{Steps}}<\/div>{{/Steps}}\n\n    {{#Why}}<p class=\"r why\"><b class=\"lb\">ทำไมถึงได้ผล<\/b>{{Why}}<\/p>{{/Why}}\n    {{#Example}}<p class=\"r ex\"><b class=\"lb\">ตัวอย่าง<\/b>{{Example}}<\/p>{{/Example}}\n    {{#Action}}<p class=\"r act\"><b class=\"lb\">ลงมือทำ<\/b>{{Action}}<\/p>{{/Action}}\n    {{#Caveat}}<p class=\"r cav\"><b class=\"lb\">ข้อควรระวัง<\/b>{{Caveat}}<\/p>{{/Caveat}}\n\n    {{#Source}}<div class=\"src\">{{Source}}<\/div>{{/Source}}\n  <\/div>\n<\/div>"}, {"name": " Think", "front": "{{#Think_Q}}\n<div class=\"wrap f th\" style=\"--d:8s\">\n  <div class=\"top\"><span class=\"chip\"><\/span><\/div>\n  <div class=\"timer\"><i><\/i><\/div>\n  {{#Title}}<div class=\"ttl\">{{Title}}<\/div>{{/Title}}\n  <div class=\"q\">{{Think_Q}}<\/div>\n  <div class=\"lens\"><span>หลักฐาน<\/span><span>ข้อยกเว้น<\/span><span>ทดสอบกับตัวเอง<\/span><\/div>\n  <div class=\"hint\"><span class=\"wait\">คิดให้ครบก่อนพลิก<\/span><span class=\"go\">พร้อมเฉลยแล้ว<\/span><\/div>\n<\/div>\n{{/Think_Q}}", "back": "{{FrontSide}}\n<style>.timer,.hint,.lens{display:none}.q{font-size:19px;line-height:1.6;font-weight:500;color:var(--slate)}<\/style>\n\n<div class=\"wrap b th\">\n  <div id=\"answer\" class=\"rule\"><i><\/i><\/div>\n\n  <div class=\"reveal\">\n    <div class=\"head\">{{#Evidence}}<div class=\"ev ev-{{Evidence}}\"><i><\/i><b><\/b><\/div>{{/Evidence}}<\/div>\n    <div class=\"tans\">{{Think_A}}<\/div>\n    {{#Source}}<div class=\"src\">{{Source}}<\/div>{{/Source}}\n  <\/div>\n<\/div>"}]}, {"name": "SelfDev Quote", "notes": 0, "fields": ["Text", "Who", "Meaning", "Think", "Source"], "css": "@import url(\"https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap\");\n\n/* ============================================================\n   SelfDev · Gilt & Cloth\n   ปกผ้าสีกรมท่า ปั๊มทองเปลว\n   ทอง = โครงสร้าง (เส้น ชื่อ ตัวเลข)   สีอื่นมีความหมายเดียว\n   เขียว ลงมือทำ | น้ำเงิน โมเดล | ม่วง คิดวิเคราะห์ | ส้มชมพู ข้อควรระวัง\n   ============================================================ */\n\n:root{\n  --cloth:#0B1630;\n  --gilt:#E3C070; --gilt-lite:#F6E2A0;\n  --ivory:#F2EDE0; --soft:#DCE3F2; --slate:#AEB8CE; --mist:#7E8AA5;\n  --emerald:#5ED6AA; --sapphire:#86B7FF; --amethyst:#C0A8FF; --coral:#F4A08F; --steel:#9FB0D4;\n  --f-body:\"Sarabun\",\"Noto Sans Thai\",\"Noto Sans Thai UI\",\"Sukhumvit Set\",\"Thonburi\",\"Leelawadee UI\",\"Tahoma\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --f-serif:\"Noto Serif Thai\",\"Thonburi\",\"Georgia\",\"Times New Roman\",serif;\n}\n\n/* ---------- หน้ากระดาษ ---------- */\nhtml,body{margin:0;padding:0;background-color:var(--cloth)}\n.card{\n  margin:0;min-height:100vh;\n  font-family:var(--f-body);font-size:17px;line-height:1.8;color:var(--ivory);text-align:left;\n  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;\n  background-color:var(--cloth);\n  background-image:\n    linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 300px),\n    repeating-linear-gradient(0deg,rgba(255,255,255,.009) 0 1px,transparent 1px 5px),\n    repeating-linear-gradient(90deg,rgba(255,255,255,.006) 0 1px,transparent 1px 5px);\n}\n::selection{background:rgba(227,192,112,.32);color:#fff}\n\n.wrap{--a:var(--gilt);--a-rgb:227,192,112;box-sizing:border-box;max-width:680px;margin:0 auto;padding:0 20px}\n.wrap.f{padding-top:22px}\n.wrap.b{padding-bottom:calc(44px + env(safe-area-inset-bottom,0px))}\n.k-concept{--a:var(--gilt);--a-rgb:227,192,112}\n.k-action{--a:var(--emerald);--a-rgb:94,214,170}\n.k-framework{--a:var(--sapphire);--a-rgb:134,183,255}\n.th{--a:var(--amethyst);--a-rgb:192,168,255}\n\n/* ---------- ป้ายสันปก (ชนิดการ์ด) ---------- */\n.top{margin:0 0 12px}\n.chip{display:none;padding:1px 11px 1px 10px;border:1px solid rgba(var(--a-rgb),.55);border-radius:2px;background:rgba(var(--a-rgb),.07);color:var(--a);font-size:12.5px;font-weight:600;line-height:1.75;letter-spacing:.03em}\n.chip::before{content:\"\";display:inline-block;width:5px;height:5px;margin:0 8px 2px 0;background:var(--a);transform:rotate(45deg)}\n.k-concept .chip,.k-action .chip,.k-framework .chip,.th .chip,.qt .chip{display:inline-block}\n.k-concept .chip::after{content:\"แนวคิด\"}\n.k-action .chip::after{content:\"ลงมือทำ\"}\n.k-framework .chip::after{content:\"โมเดล\"}\n.th .chip::after{content:\"คิดวิเคราะห์\"}\n.qt .chip::after{content:\"คำคม\"}\n\n/* ---------- เส้นเวลาคิด (กันกดข้าม): เต็มแล้วเปลี่ยนเป็นเขียว ---------- */\n.timer{position:relative;height:2px;margin:0 0 22px;border-radius:2px;background:rgba(var(--a-rgb),.16);overflow:hidden}\n.timer i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(var(--a-rgb),.4),var(--a));animation:sd-fill var(--d,4s) linear forwards}\n.timer i::after{content:\"\";position:absolute;left:0;right:0;top:0;bottom:0;background:var(--emerald);opacity:0;animation:sd-go .5s ease var(--d,4s) forwards}\n.hint{position:relative;height:22px;margin:26px 0 34px;font-size:13px;line-height:22px;color:var(--mist)}\n.hint span{position:absolute;left:0;top:0;white-space:nowrap}\n.hint .wait{animation:sd-out .3s ease var(--d,4s) forwards}\n.hint .go{opacity:0;color:var(--emerald);font-weight:600;animation:sd-go .5s ease var(--d,4s) forwards}\n@keyframes sd-fill{to{width:100%}}\n@keyframes sd-go{to{opacity:1}}\n@keyframes sd-out{to{opacity:0}}\n\n/* ---------- โจทย์ ---------- */\n.q{margin:0;font-family:var(--f-serif);font-weight:600;font-size:23px;line-height:1.65;color:#FBF6E8}\n\n/* ---------- ช่วงเฉลย: เส้นทองวาดออกจากกลาง แล้วเนื้อหาค่อยขึ้น (ครั้งเดียว) ---------- */\n.rule{display:flex;align-items:center;gap:14px;margin:28px 0 24px;animation:sd-draw .6s cubic-bezier(.2,.8,.2,1) both}\n.rule::before,.rule::after{content:\"\";flex:1;height:1px}\n.rule::before{background:linear-gradient(90deg,rgba(227,192,112,0),rgba(227,192,112,.7))}\n.rule::after{background:linear-gradient(270deg,rgba(227,192,112,0),rgba(227,192,112,.7))}\n.rule i{width:7px;height:7px;background:var(--gilt);transform:rotate(45deg);box-shadow:0 0 10px rgba(227,192,112,.55)}\n.reveal{animation:sd-rise .5s ease .12s both}\n@keyframes sd-draw{from{transform:scaleX(.05);opacity:0}to{transform:none;opacity:1}}\n@keyframes sd-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n\n/* ---------- บันทึกต่อท้าย (ป้ายอยู่บรรทัดเดียวกับเนื้อหา) ---------- */\n.r{margin:14px 0 0;font-size:16.5px;line-height:1.85;color:var(--soft)}\n.r .lb{margin-right:.6em;font-weight:700;color:var(--c,var(--gilt))}\n.why{--c:var(--gilt)}\n.ex{--c:var(--sapphire)}\n\n.src{margin-top:28px;padding-top:12px;border-top:1px solid rgba(227,192,112,.18);font-size:12.5px;line-height:1.7;color:var(--mist)}\n.src::before{content:\"อ้างอิง\";margin-right:.7em;font-weight:600;color:rgba(227,192,112,.8)}\n\n/* ---------- ตัวอักษรในช่อง ---------- */\nb,strong{color:var(--gilt-lite);font-weight:600}\nem{color:#BCD0F5}\n.card a{color:var(--gilt)}\n.card img{max-width:100%;height:auto;border-radius:8px}\n.card code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;padding:.08em .4em;border-radius:4px;background:rgba(255,255,255,.08)}\n.r ul,.r ol,.ans ul,.ans ol{margin:.35em 0;padding-left:1.3em}\n.card li::marker{color:var(--gilt)}\n\n/* ตัวอักษรหัวเรื่องแบบทองเปลว (ถ้าเครื่องไม่รองรับ จะใช้สีทองเรียบแทน) */\n@supports ((-webkit-background-clip:text) or (background-clip:text)){\n  .ttl,.qt .quote::before{\n    background-image:linear-gradient(100deg,#B98A33 0%,#F6E2A0 36%,#D5A94E 64%,#F3DA92 100%);\n    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;\n  }\n}\n\n@media (max-width:480px){\n  .card{font-size:16.5px}\n  .wrap{padding:0 16px}\n  .q{font-size:21.5px}\n}\n@media (prefers-reduced-motion:reduce){\n  .rule,.reveal,.ev i{animation:none}\n  .timer i{animation:none;width:100%}\n  .timer i::after{animation:none;opacity:1}\n  .hint .wait{animation:none;opacity:0}\n  .hint .go{animation:none;opacity:1}\n}\n\n/* ===== SelfDev Quote : คำคม / ประโยคทอง (Cloze) ===== */\n\n.quote{margin:4px 0 0;font-family:var(--f-serif);font-weight:500;font-size:22px;line-height:1.95;color:var(--ivory)}\n.quote::before{content:\"\\201C\";display:block;height:38px;margin:6px 0 12px;font-size:86px;font-weight:700;line-height:.7;color:var(--gilt)}\n.who{margin:18px 0 0;font-family:var(--f-serif);font-weight:600;font-size:15px;line-height:1.6;color:var(--gilt)}\n.who::before{content:\"\";display:inline-block;width:28px;height:1px;margin-right:10px;vertical-align:middle;background:var(--gilt)}\n\n/* ช่องว่างด้านหน้า = ช่องเติมคำปั๊มทอง / ด้านหลัง = คำที่ถูกขีดด้วยปากกาเน้นข้อความสีทอง */\n.quote.front .cloze{display:inline-block;min-width:3.4em;margin:0 .15em;padding:0 .5em;border-bottom:2px solid var(--gilt);border-radius:3px 3px 0 0;background:rgba(240,196,92,.14);color:var(--gilt);font-weight:700;letter-spacing:.14em;text-align:center}\n.quote.back .cloze{padding:0 .12em;background:linear-gradient(transparent 58%,rgba(240,196,92,.40) 58%);color:var(--gilt-lite);font-weight:700;-webkit-box-decoration-break:clone;box-decoration-break:clone}\n\n/* ตั้งคำถามกับประโยค */\n.thk{--c:var(--amethyst);padding-left:14px;border-left:2px solid rgba(192,168,255,.65)}\n\n@media (max-width:480px){ .quote{font-size:21px} }", "tmpls": [{"name": "Card 1", "front": "<div class=\"wrap f qt\" style=\"--d:4s\">\n  <div class=\"top\"><span class=\"chip\"><\/span><\/div>\n  <div class=\"timer\"><i><\/i><\/div>\n  <div class=\"quote front\">{{cloze:Text}}<\/div>\n  {{#Who}}<div class=\"who\">{{Who}}<\/div>{{/Who}}\n  <div class=\"hint\"><span class=\"wait\">เติมคำที่หายไปในใจก่อนพลิก<\/span><span class=\"go\">พร้อมเฉลยแล้ว<\/span><\/div>\n<\/div>", "back": "<div class=\"wrap f qt\">\n  <div class=\"top\"><span class=\"chip\"><\/span><\/div>\n  <div class=\"quote back\">{{cloze:Text}}<\/div>\n  {{#Who}}<div class=\"who\">{{Who}}<\/div>{{/Who}}\n<\/div>\n\n<div class=\"wrap b qt\">\n  <div id=\"answer\" class=\"rule\"><i><\/i><\/div>\n\n  <div class=\"reveal\">\n    {{#Meaning}}<p class=\"r why\"><b class=\"lb\">ใจความ<\/b>{{Meaning}}<\/p>{{/Meaning}}\n    {{#Think}}<p class=\"r thk\"><b class=\"lb\">ตั้งคำถาม<\/b>{{Think}}<\/p>{{/Think}}\n    {{#Source}}<div class=\"src\">{{Source}}<\/div>{{/Source}}\n  <\/div>\n<\/div>"}]}, {"name": "Vocab-Flip", "notes": 3398, "fields": ["Word", "POS", "Eng_Def", "Thai_Def", "Synonyms", "Antonyms", "Collocations", "Example", "IPA", "Image", "Level", "Image+", "ImageHint", "ImageCredit", "Memory_Hook"], "css": "/* ══════════════════════════════════════════════\n   MIDNIGHT INK — Complete Stylesheet (v5)\n   มือถือก่อน · โหมดสว่าง = Paper & Ink · โหมดมืด = Midnight Ink\n   กรมท่าอินดิโก + ทองอำพัน + มิ้นต์/คอรัล/ฟ้า สำหรับหมวดคำ\n   v5: Memory_Hook เป็นข้อความล้วน (ไม่มีกรอบ/ป้ายหมวด/ปุ่มพับ)\n   ══════════════════════════════════════════════ */\n\n/* ── ฟอนต์ (bundle ลง collection.media ตั้งชื่อขึ้นต้น _) ── */\n@font-face {\n  font-family: \"IBM Plex Sans Thai\";\n  src: url(\"_IBMPlexSansThai-Regular.woff2\") format(\"woff2\");\n  font-weight: 400; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"IBM Plex Sans Thai\";\n  src: url(\"_IBMPlexSansThai-SemiBold.woff2\") format(\"woff2\");\n  font-weight: 600; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"IBM Plex Sans Thai\";\n  src: url(\"_IBMPlexSansThai-Bold.woff2\") format(\"woff2\");\n  font-weight: 700; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"Inter\";\n  src: url(\"_Inter-Regular.woff2\") format(\"woff2\");\n  font-weight: 400; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: \"Inter\";\n  src: url(\"_Inter-Bold.woff2\") format(\"woff2\");\n  font-weight: 700; font-style: normal; font-display: swap;\n}\n\n/* ── โหมดสว่าง: Paper & Ink ──────────────────── */\n:root {\n  --font-main: \"Inter\", \"IBM Plex Sans Thai\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n\n  --bg-gradient: linear-gradient(160deg, #f7f8fd 0%, #edf0fa 55%, #e5e9f7 100%);\n  --glass-bg: rgba(255, 255, 255, 0.74);\n  --glass-border: rgba(45, 58, 130, 0.14);\n  --glass-edge: rgba(255, 255, 255, 0.95);\n  --glass-card: rgba(255, 255, 255, 0.72);\n  --chip-bg: rgba(255, 255, 255, 0.88);\n  --shadow: 0 18px 44px rgba(19, 26, 58, 0.12);\n\n  --text-primary: #131a3a;\n  --text-muted: #4d5688;\n\n  --accent: #e0900f;               /* ตกแต่ง: เส้น วงแหวน */\n  --accent-soft: #f2b544;\n  --accent-text: #9a5a00;          /* ข้อความ ผ่าน AA */\n  --pill-bg: #131a3a;\n  --pill-fg: #ffffff;\n  --hl-bg: rgba(245, 166, 35, 0.34);\n\n  --orb-color-1: rgba(99, 102, 241, 0.20);\n  --orb-color-2: rgba(245, 166, 35, 0.20);\n\n  --syn-fg: #047857; --syn-bg: rgba(16, 185, 129, 0.10); --syn-bd: rgba(5, 150, 105, 0.30);\n  --ant-fg: #be123c; --ant-bg: rgba(244, 63, 94, 0.09);  --ant-bd: rgba(225, 29, 72, 0.28);\n  --col-fg: #0369a1; --col-bg: rgba(14, 165, 233, 0.10); --col-bd: rgba(2, 132, 199, 0.30);\n  --on-rel: #ffffff;\n\n  --good: #15803d;\n  --bad: #b91c1c;\n\n  --ready: #15803d;\n  --ready-soft: rgba(34, 197, 94, 0.14);\n  --ready-bd: rgba(22, 163, 74, 0.45);\n  --ready-glow: rgba(34, 197, 94, 0.22);\n  --scrim: 247, 248, 253;\n}\n\n/* ── โหมดมืด: Midnight Ink ───────────────────── */\n.nightMode, .night_mode {\n  color-scheme: dark;\n  --bg-gradient: linear-gradient(160deg, #080c1c 0%, #0f1633 55%, #090d20 100%);\n  --glass-bg: rgba(20, 27, 58, 0.66);\n  --glass-border: rgba(148, 163, 255, 0.16);\n  --glass-edge: rgba(255, 255, 255, 0.07);\n  --glass-card: rgba(255, 255, 255, 0.05);\n  --chip-bg: rgba(8, 12, 28, 0.45);\n  --shadow: 0 22px 50px rgba(0, 0, 0, 0.45);\n\n  --text-primary: #eef1fb;\n  --text-muted: #a9b3d6;\n\n  --accent: #f6b94a;\n  --accent-soft: #ffd27a;\n  --accent-text: #ffd27a;\n  --pill-bg: #f6b94a;\n  --pill-fg: #1a1204;\n  --hl-bg: rgba(246, 185, 74, 0.26);\n\n  --orb-color-1: rgba(99, 102, 241, 0.34);\n  --orb-color-2: rgba(246, 185, 74, 0.14);\n\n  --syn-fg: #6ee7b7; --syn-bg: rgba(52, 211, 153, 0.12); --syn-bd: rgba(110, 231, 183, 0.30);\n  --ant-fg: #fda4af; --ant-bg: rgba(251, 113, 133, 0.12); --ant-bd: rgba(253, 164, 175, 0.30);\n  --col-fg: #7dd3fc; --col-bg: rgba(56, 189, 248, 0.12);  --col-bd: rgba(125, 211, 252, 0.30);\n  --on-rel: #0b1020;\n\n  --good: #4ade80;\n  --bad: #fb7185;\n\n  --ready: #86efac;\n  --ready-soft: rgba(74, 222, 128, 0.14);\n  --ready-bd: rgba(134, 239, 172, 0.45);\n  --ready-glow: rgba(74, 222, 128, 0.18);\n  --scrim: 12, 18, 44;\n}\n\n/* ── ฐาน ────────────────────────────────────── */\nbody, .card, #qa {\n  background: var(--bg-gradient) !important;\n  margin: 0 !important;\n  padding: 0 !important;\n  width: 100% !important;\n  display: block !important;\n}\n.card {\n  font-family: var(--font-main);\n  -webkit-font-smoothing: subpixel-antialiased;\n  text-rendering: optimizeLegibility;\n  -webkit-text-size-adjust: 100%;\n}\n.nightMode .card, .night_mode .card { -webkit-font-smoothing: antialiased; }\n::selection { background: var(--accent); color: #1a1204; }\n\n/* ── เลย์เอาต์ (ฐานคือมือถือ) ──────────────── */\n.ambient-wrapper {\n  position: relative;\n  overflow: hidden;\n  width: 100%;\n  min-height: 100vh;\n  min-height: 100svh;\n  box-sizing: border-box;\n  padding: 18px 12px;\n  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));\n  display: flex !important;\n  justify-content: center !important;\n  align-items: center !important;\n}\n\n.aurora-orb {\n  position: absolute;\n  border-radius: 50%;\n  z-index: 0;\n  pointer-events: none;\n}\n.orb-1 {\n  width: 85vw; height: 85vw; top: -14%; left: -10%;\n  background: radial-gradient(circle, var(--orb-color-1) 0%, transparent 70%);\n}\n.orb-2 {\n  width: 80vw; height: 80vw; bottom: -14%; right: -12%;\n  background: radial-gradient(circle, var(--orb-color-2) 0%, transparent 70%);\n}\n\n.glass-masterpiece {\n  position: relative;\n  z-index: 10;\n  width: 100%;\n  max-width: 640px;\n  margin: 0 auto;\n  padding: 46px 20px 28px;\n  border-radius: 26px;\n  box-sizing: border-box;\n  background: var(--glass-bg);\n  -webkit-backdrop-filter: blur(20px) saturate(150%);\n  backdrop-filter: blur(20px) saturate(150%);\n  border: 1px solid var(--glass-border);\n  box-shadow: var(--shadow), inset 0 1px 1px var(--glass-edge);\n  transition: border-color 0.5s ease, box-shadow 0.5s ease;\n}\n@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {\n  .glass-masterpiece { background: rgba(244, 246, 253, 0.95); }\n  .nightMode .glass-masterpiece, .night_mode .glass-masterpiece { background: rgba(14, 20, 46, 0.96); }\n}\n\n/* ── ป้ายระดับ CEFR ─────────────────────────── */\n.level-badge {\n  position: absolute;\n  top: 14px; right: 14px;\n  padding: 4px 11px;\n  border-radius: 999px;\n  font-size: 10px; font-weight: 700;\n  letter-spacing: 0.1em;\n  line-height: 1.6;\n  border: 1px solid currentColor;\n}\n.lv-A1, .lv-A2 { color: #047857; background: rgba(4, 120, 87, 0.10); }\n.lv-B1, .lv-B2 { color: #9a5a00; background: rgba(224, 144, 15, 0.14); }\n.lv-C1, .lv-C2 { color: #be123c; background: rgba(190, 18, 60, 0.10); }\n.nightMode .lv-A1, .nightMode .lv-A2, .night_mode .lv-A1, .night_mode .lv-A2 { color: #6ee7b7; background: rgba(52, 211, 153, 0.13); }\n.nightMode .lv-B1, .nightMode .lv-B2, .night_mode .lv-B1, .night_mode .lv-B2 { color: #ffd27a; background: rgba(246, 185, 74, 0.14); }\n.nightMode .lv-C1, .nightMode .lv-C2, .night_mode .lv-C1, .night_mode .lv-C2 { color: #fda4af; background: rgba(251, 113, 133, 0.13); }\n\n/* ── ด้านหน้า: ประโยคบริบทเป็นพระเอก ───────── */\n.ctx-label {\n  display: flex;\n  align-items: baseline;\n  justify-content: center;\n  gap: 8px;\n  margin-bottom: 14px;\n  color: var(--accent-text);\n}\n.ctx-th { font-size: 13px; font-weight: 700; }\n.ctx-en { font-size: 9px; font-weight: 700; letter-spacing: 0.2em; opacity: 0.8; }\n\n.front-example {\n  font-size: 20px;\n  font-weight: 500;\n  line-height: 1.7;\n  color: var(--text-primary);\n  text-align: center;\n  word-break: auto-phrase;\n  text-wrap: pretty;\n}\n.front-word {\n  font-size: 40px;\n  font-weight: 700;\n  line-height: 1.2;\n  color: var(--text-primary);\n  letter-spacing: -0.02em;\n  text-align: center;\n  margin-bottom: 10px;\n  word-break: normal;\n  overflow-wrap: break-word;\n  text-wrap: balance;\n}\n.front-meta {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 10px;\n  flex-wrap: wrap;\n}\n.front-ipa { font-size: 17px; font-weight: 500; color: var(--text-muted); }\n\n/* คำเป้าหมายในประโยค: ไฮไลต์แบบปากกาเน้นข้อความ */\n.hl {\n  color: var(--accent-text);\n  font-weight: 700;\n  padding: 0 0.14em;\n  border-radius: 0.25em;\n  background: linear-gradient(transparent 52%, var(--hl-bg) 52%);\n  -webkit-box-decoration-break: clone;\n  box-decoration-break: clone;\n}\n.blank { color: var(--accent-text); letter-spacing: 0.1em; opacity: 0.65; }\n\n/* ไล่สว่างทีละคำ: สคริปต์เติม .sweep แล้วค่อยเติม .on */\n.sweep .tk { opacity: 0.2; transition: opacity 0.4s ease; }\n.sweep.on .tk, .sweep .hl .tk { opacity: 1; }\n\n/* ── เส้นคั่น ───────────────────────────────── */\n.divider-container { width: 100%; display: flex; justify-content: center; margin: 22px 0; }\n.liquid-divider {\n  width: 100%; height: 1px;\n  background: linear-gradient(to right, transparent, var(--text-muted), transparent);\n  opacity: 0.28;\n}\n\n/* ── หัวคำศัพท์ด้านหลัง ─────────────────────── */\n.word-header-block {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px 12px;\n  flex-wrap: wrap;\n  margin-bottom: 22px;\n}\n.word-title {\n  font-size: 36px; font-weight: 700; line-height: 1.2;\n  color: var(--text-primary);\n  letter-spacing: -0.02em;\n}\n.word-pos {\n  font-size: 10px; font-weight: 700;\n  text-transform: uppercase;\n  background: var(--pill-bg);\n  color: var(--pill-fg);\n  padding: 4px 10px;\n  border-radius: 6px;\n  letter-spacing: 0.05em;\n}\n.word-ipa { font-size: 18px; color: var(--text-muted); font-weight: 500; }\n\n/* ── กล่องนิยาม ─────────────────────────────── */\n.def-container { display: flex; flex-direction: column; gap: 10px; }\n.def-box {\n  background: var(--glass-card);\n  padding: 16px 18px;\n  border-radius: 16px;\n  border: 1px solid var(--glass-border);\n  text-align: left;\n}\n.thai-box { border-left: 4px solid var(--accent); }\n\n.sub-label {\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: 0.14em;\n  color: var(--text-muted);\n  margin-bottom: 6px;\n}\n.def-text {\n  font-size: 16px; line-height: 1.6;\n  color: var(--text-primary);\n  word-break: auto-phrase;\n  text-wrap: pretty;\n}\n.thai-text-accent {\n  font-size: 20px;\n  color: var(--accent-text);\n  font-weight: 600;\n}\n\n/* ── Memory_Hook: ข้อความล้วน ไม่มีกรอบ ───────\n   อยู่ใต้ Thai Definition ก่อน English Definition\n   ① ② ③ = รอบที่ ดึงออกมาเป็นตัวเล็กสีจางห้อยซ้าย */\n.hook {\n  position: relative;\n  margin: 8px 6px 6px;\n  font-size: 16px;\n  line-height: 1.75;\n  color: var(--text-primary);\n  text-align: left;\n  word-break: auto-phrase;\n  text-wrap: pretty;\n}\n.hook.has-n { padding-left: 1.8em; }\n.hook .hk-n {\n  position: absolute;\n  left: 0; top: 0.12em;\n  font-size: 0.9em;\n  line-height: 1.5;\n  color: var(--text-muted);\n  opacity: 0.8;\n}\n.hook b { font-weight: 700; }\n\n/* ── ประโยคตัวอย่าง (ด้านหลัง) ───────────────── */\n.example-box {\n  margin-top: 10px;\n  background: var(--glass-card);\n  padding: 16px 18px;\n  border-radius: 16px;\n  border: 1px solid var(--glass-border);\n  border-left: 4px solid var(--accent-soft);\n  text-align: left;\n}\n.example-text {\n  font-size: 17px;\n  line-height: 1.7;\n  font-weight: 500;\n  color: var(--text-primary);\n  word-break: auto-phrase;\n  text-wrap: pretty;\n}\n\n/* ── คำพ้อง / ตรงข้าม / คำคู่: แถวสีแตะเปิด ──── */\n.rel {\n  margin-top: 10px;\n  border-radius: 16px;\n  background: var(--rel-bg);\n  border: 1px solid var(--rel-bd);\n  text-align: left;\n  overflow: hidden;\n}\n.rel-syn { --rel-fg: var(--syn-fg); --rel-bg: var(--syn-bg); --rel-bd: var(--syn-bd); }\n.rel-ant { --rel-fg: var(--ant-fg); --rel-bg: var(--ant-bg); --rel-bd: var(--ant-bd); }\n.rel-col { --rel-fg: var(--col-fg); --rel-bg: var(--col-bg); --rel-bd: var(--col-bd); }\n\n.rel-sum {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  min-height: 54px;\n  box-sizing: border-box;\n  padding: 10px 16px;\n  color: var(--rel-fg);\n  cursor: pointer;\n  list-style: none;\n  -webkit-tap-highlight-color: transparent;\n  -webkit-user-select: none;\n  user-select: none;\n}\n.rel-sum::-webkit-details-marker { display: none; }\n.rel-sum::marker { content: \"\"; }\n.rel-sum::after {\n  content: \"\";\n  flex: none;\n  width: 8px; height: 8px;\n  margin: -3px 4px 0 2px;\n  border-right: 2px solid currentColor;\n  border-bottom: 2px solid currentColor;\n  transform: rotate(45deg);\n  transition: transform 0.2s ease, margin 0.2s ease;\n}\n.rel[open] > .rel-sum::after { transform: rotate(-135deg); margin-top: 3px; }\n\n.rel-icon {\n  flex: none;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 28px; height: 28px;\n  border: 1.5px solid currentColor;\n  border-radius: 50%;\n  font-size: 15px; font-weight: 700; line-height: 1;\n}\n.rel-titles { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }\n.rel-th { font-size: 15px; font-weight: 700; line-height: 1.3; }\n.rel-en { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; opacity: 0.8; }\n.rel-count {\n  flex: none;\n  min-width: 22px;\n  box-sizing: border-box;\n  padding: 2px 8px;\n  border-radius: 999px;\n  background: var(--rel-fg);\n  color: var(--on-rel);\n  font-size: 12px; font-weight: 700; line-height: 1.5;\n  text-align: center;\n}\n.rel-count:empty { display: none; }\n\n.rel-body {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n  padding: 2px 16px 16px;\n  font-size: 15px;\n  line-height: 1.5;\n  color: var(--text-primary);\n}\n.rel[open] > .rel-body { animation: relIn 0.22s ease; }\n@keyframes relIn {\n  from { opacity: 0; transform: translateY(-4px); }\n  to   { opacity: 1; transform: none; }\n}\n.chip {\n  display: inline-block;\n  padding: 6px 13px;\n  border-radius: 999px;\n  background: var(--chip-bg);\n  border: 1px solid var(--rel-bd);\n  color: var(--rel-fg);\n  font-size: 15px;\n  font-weight: 600;\n  line-height: 1.4;\n}\n\n/* ── รูปภาพ ─────────────────────────────────── */\n.card-image {\n  margin: 16px auto 4px;\n  width: 100%;\n  max-width: 460px;\n  aspect-ratio: 16 / 10;\n  border-radius: 14px;\n  overflow: hidden;\n  border: 1px solid var(--glass-border);\n  box-shadow: 0 12px 28px rgba(19, 26, 58, 0.16);\n  background: rgba(99, 102, 241, 0.08);\n}\n.card-image img {\n  display: block;\n  width: 100% !important;\n  height: 100% !important;\n  max-width: none !important;\n  object-fit: cover;\n  object-position: center 42%;\n  margin: 0 !important;\n  border-radius: 0;\n}\n.nightMode .card-image img, .night_mode .card-image img { filter: brightness(0.86) saturate(0.92); }\n@supports not (aspect-ratio: 16 / 10) {\n  .card-image { height: 0; padding-bottom: 62.5%; position: relative; }\n  .card-image img { position: absolute; inset: 0; }\n}\n.img-credit {\n  margin-top: 12px;\n  font-size: 10px;\n  letter-spacing: 0.04em;\n  color: var(--text-muted);\n  text-align: center;\n  opacity: 0.6;\n}\n\n/* ── ช่องพิมพ์ตอบ (เผื่อใช้ {{type:...}}) ───── */\n.type-row { margin-top: 22px; }\n#typeans {\n  font-family: var(--font-main);\n  font-size: 18px; font-weight: 500;\n  padding: 13px 18px;\n  border-radius: 14px;\n  border: 1px solid var(--glass-border);\n  background: var(--glass-card);\n  color: var(--text-primary);\n  text-align: center;\n  width: 100%;\n  box-sizing: border-box;\n  outline: none;\n  transition: border-color 0.15s ease;\n}\n#typeans:focus { border-color: var(--accent); }\ncode#typeans { display: block; padding: 10px; line-height: 1.6; }\n.typeGood   { color: var(--good); background: transparent; font-weight: 700; }\n.typeBad    { color: var(--bad);  background: transparent; text-decoration: line-through; }\n.typeMissed { color: var(--accent-text); background: transparent; }\n\n/* ── วงแหวนหน่วงเวลา + สถานะพร้อมตอบ (เขียวอ่อน) ── */\n.gate {\n  display: flex; align-items: center; justify-content: center;\n  gap: 10px;\n  width: fit-content;\n  margin: 24px auto 0;\n  padding: 8px 18px;\n  border-radius: 999px;\n  border: 1px solid transparent;\n  transition: background-color 0.4s ease, border-color 0.4s ease;\n}\n.gate-svg { width: 26px; height: 26px; transform: rotate(-90deg); }\n.gate-bg { fill: none; stroke: var(--glass-border); stroke-width: 2.2; }\n.gate-fg { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; }\n.gate-hint {\n  font-size: 12px; font-weight: 700;\n  letter-spacing: 0.08em;\n  color: var(--text-muted);\n}\n.gate.gate-done {\n  background: var(--ready-soft);\n  border-color: var(--ready-bd);\n  animation: readyPop 0.45s ease;\n}\n.gate.gate-done .gate-fg { stroke: var(--ready); }\n.gate.gate-done .gate-bg { stroke: var(--ready-bd); }\n.gate.gate-done .gate-hint { color: var(--ready); }\n@keyframes readyPop {\n  0%   { transform: scale(0.94); }\n  60%  { transform: scale(1.05); }\n  100% { transform: scale(1); }\n}\n.glass-masterpiece.ready {\n  border-color: var(--ready-bd);\n  box-shadow:\n    var(--shadow),\n    0 0 0 3px var(--ready-soft),\n    0 0 38px var(--ready-glow),\n    inset 0 1px 1px var(--glass-edge);\n}\n\n/* ── ปุ่มเสียง ──────────────────────────────── */\n.replay-button svg {\n  width: 28px; height: 28px;\n  fill: var(--text-muted) !important;\n  opacity: 0.7;\n  vertical-align: middle;\n  margin-left: 4px;\n  transition: transform 0.2s, opacity 0.2s;\n}\n.replay-button svg:hover { opacity: 1; transform: scale(1.1); }\n\n/* ── กลุ่มคำที่เกี่ยวข้อง (มองเห็นเลย ไม่ต้องกด) ── */\n.fam {\n  margin-top: 10px;\n  padding: 4px 16px;\n  border-radius: 16px;\n  background: var(--glass-card);\n  border: 1px solid var(--glass-border);\n  text-align: left;\n}\n.fam-row {\n  display: flex;\n  align-items: flex-start;\n  gap: 12px;\n  padding: 10px 0;\n}\n.fam-row + .fam-row { border-top: 1px dashed var(--glass-border); }\n.fam-syn { --rel-fg: var(--syn-fg); --rel-bg: var(--syn-bg); --rel-bd: var(--syn-bd); }\n.fam-ant { --rel-fg: var(--ant-fg); --rel-bg: var(--ant-bg); --rel-bd: var(--ant-bd); }\n.fam-col { --rel-fg: var(--col-fg); --rel-bg: var(--col-bg); --rel-bd: var(--col-bd); }\n\n.fam-label {\n  flex: none;\n  display: flex;\n  align-items: center;\n  gap: 7px;\n  width: 98px;\n  padding-top: 3px;\n  color: var(--rel-fg);\n}\n.fam-icon {\n  flex: none;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 22px; height: 22px;\n  border: 1.5px solid currentColor;\n  border-radius: 50%;\n  font-size: 13px; font-weight: 700; line-height: 1;\n}\n.fam-th { font-size: 13.5px; font-weight: 700; line-height: 1.3; }\n\n.fam-chips {\n  flex: 1;\n  min-width: 0;\n  display: flex;\n  flex-wrap: wrap;\n  gap: 6px;\n}\n.fam .chip {\n  padding: 4px 11px;\n  font-size: 14.5px;\n}\n.fam-ant .chip { font-weight: 500; }\n.chip-extra { display: none; }\n.fam-row.open .chip-extra { display: inline-block; }\n.chip-more {\n  font-family: inherit;\n  cursor: pointer;\n  background: transparent;\n  border-style: dashed;\n  -webkit-tap-highlight-color: transparent;\n}\n.fam-row.open .chip-more { display: none; }\n\n/* การ์ดที่มี Memory_Hook: พับกลุ่มคำไว้ใต้ปุ่มเดียว */\n.fam-fold {\n  margin-top: 10px;\n  border-radius: 16px;\n  background: var(--glass-card);\n  border: 1px solid var(--glass-border);\n  overflow: hidden;\n  text-align: left;\n}\n.fam-fold-sum {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  min-height: 48px;\n  box-sizing: border-box;\n  padding: 8px 16px;\n  color: var(--text-muted);\n  font-size: 14px; font-weight: 700;\n  cursor: pointer;\n  list-style: none;\n  -webkit-tap-highlight-color: transparent;\n  -webkit-user-select: none;\n  user-select: none;\n}\n.fam-fold-sum::-webkit-details-marker { display: none; }\n.fam-fold-sum::marker { content: \"\"; }\n.fam-fold-sum::after {\n  content: \"\";\n  flex: none;\n  width: 8px; height: 8px;\n  margin: -3px 4px 0 auto;\n  border-right: 2px solid currentColor;\n  border-bottom: 2px solid currentColor;\n  transform: rotate(45deg);\n  transition: transform 0.2s ease, margin 0.2s ease;\n}\n.fam-fold[open] > .fam-fold-sum::after { transform: rotate(-135deg); margin-top: 3px; }\n.fam-fold-count {\n  min-width: 20px;\n  box-sizing: border-box;\n  padding: 1px 7px;\n  border-radius: 999px;\n  background: var(--glass-border);\n  color: var(--text-primary);\n  font-size: 12px; font-weight: 700; line-height: 1.5;\n  text-align: center;\n}\n.fam-fold > .fam {\n  margin-top: 0;\n  border: 0;\n  border-top: 1px solid var(--glass-border);\n  border-radius: 0;\n  background: transparent;\n}\n\n/* ── ด้านหลัง: Hero รูปอยู่หลังคำศัพท์ ──────── */\n.hero {\n  position: relative;\n  margin: -46px -20px 22px;\n  padding: 46px 20px 0;\n  border-radius: 26px 26px 0 0;\n  overflow: hidden;\n}\n.hero .word-header-block {\n  position: relative;\n  z-index: 2;\n  width: 100%;\n  margin-bottom: 0;\n}\n.hero.has-img {\n  display: flex;\n  align-items: flex-end;\n  min-height: 230px;\n  padding-bottom: 20px;\n  margin-bottom: 16px;\n}\n.hero-img {\n  position: absolute;\n  inset: 0;\n  z-index: 0;\n  overflow: hidden;\n}\n.hero-img img {\n  display: block;\n  width: 100% !important;\n  height: 100% !important;\n  max-width: none !important;\n  margin: 0 !important;\n  object-fit: cover;\n  object-position: center 40%;\n  /* เฟดลงพื้นการ์ดแค่นิดๆ — รูปยังเห็นชัด */\n  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 62%, transparent 100%);\n  mask-image: linear-gradient(to bottom, #000 0%, #000 62%, transparent 100%);\n}\n.nightMode .hero-img img, .night_mode .hero-img img { filter: brightness(0.82) saturate(0.92); }\n/* ม่านบางๆ ให้ตัวอักษรอ่านออกบนทุกรูป */\n.hero-img::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(\n    to bottom,\n    rgba(var(--scrim), 0.06) 0%,\n    rgba(var(--scrim), 0.32) 50%,\n    rgba(var(--scrim), 0.78) 100%\n  );\n}\n.hero.has-img .word-title,\n.hero.has-img .word-ipa {\n  text-shadow: 0 1px 14px rgba(var(--scrim), 0.9), 0 0 3px rgba(var(--scrim), 0.6);\n}\n.hero .level-badge { z-index: 3; }\n.hero.has-img .level-badge {\n  -webkit-backdrop-filter: blur(8px);\n  backdrop-filter: blur(8px);\n  background-image: linear-gradient(var(--chip-bg), var(--chip-bg)) !important;\n}\n.hero .img-credit {\n  position: absolute;\n  top: 17px; left: 14px;\n  z-index: 3;\n  max-width: 46%;\n  margin: 0;\n  padding: 2px 9px;\n  border-radius: 999px;\n  background: var(--chip-bg);\n  -webkit-backdrop-filter: blur(6px);\n  backdrop-filter: blur(6px);\n  opacity: 0.85;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  * { animation: none !important; transition: none !important; }\n  .sweep .tk { opacity: 1; }\n}\n\n/* ── จอกว้าง (แท็บเล็ต / คอม) ───────────────── */\n@media (min-width: 601px) {\n  .ambient-wrapper { padding: 35px 20px; }\n  .orb-1 { width: 55vw; height: 55vw; top: -12%; left: 6%; }\n  .orb-2 { width: 52vw; height: 52vw; bottom: -14%; right: 8%; }\n  .glass-masterpiece { padding: 56px 48px 46px; border-radius: 30px; }\n  .level-badge { top: 18px; right: 18px; }\n  .front-example { font-size: 26px; }\n  .front-word { font-size: 50px; }\n  .word-title { font-size: 44px; }\n  .def-text { font-size: 17px; }\n  .thai-text-accent { font-size: 23px; }\n  .example-text { font-size: 19px; }\n  .def-box, .example-box { padding: 18px 22px; }\n  #typeans { font-size: 20px; }\n  .card-image { border-radius: 16px; }\n\n  .hook { margin: 10px 8px 8px; font-size: 17px; }\n  .fam { padding: 4px 22px; }\n  .fam-label { width: 112px; }\n  .fam .chip { font-size: 15.5px; }\n\n  .hero {\n    margin: -56px -48px 22px;\n    padding: 56px 48px 0;\n    border-radius: 30px 30px 0 0;\n  }\n  .hero.has-img { min-height: 280px; padding-bottom: 26px; }\n  .hero .level-badge { top: 18px; right: 18px; }\n  .hero .img-credit { top: 21px; left: 18px; }\n}", "tmpls": [{"name": "Card 1", "front": "<div class=\"ambient-wrapper\">\n  <div class=\"aurora-orb orb-1\"><\/div>\n  <div class=\"aurora-orb orb-2\"><\/div>\n\n  <div class=\"glass-masterpiece\" id=\"card\">\n    {{#Level}}<div class=\"level-badge lv-{{Level}}\">{{Level}}<\/div>{{/Level}}\n\n    {{#Example}}\n    <div class=\"front-example\" id=\"example\">{{Example}}<\/div>\n    <div class=\"divider-container\"><div class=\"liquid-divider\"><\/div><\/div>\n    {{/Example}}\n\n    <div class=\"front-word\" id=\"word-src\">{{Word}}<\/div>\n    <div class=\"front-meta\">\n      {{#POS}}<span class=\"word-pos\">{{POS}}<\/span>{{/POS}}\n      {{#IPA}}<span class=\"front-ipa\">/{{IPA}}/<\/span>{{/IPA}}\n    <\/div>\n\n    <div class=\"gate\" id=\"gate\">\n      <svg viewBox=\"0 0 30 30\" class=\"gate-svg\">\n        <circle class=\"gate-bg\" cx=\"15\" cy=\"15\" r=\"13\"><\/circle>\n        <circle class=\"gate-fg\" id=\"gate-ring\" cx=\"15\" cy=\"15\" r=\"13\"><\/circle>\n      <\/svg>\n      <span class=\"gate-hint\" id=\"gate-hint\">นึกก่อน<\/span>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n(function () {\n  var AUTO = true;          /* true = เวลาบังคับอ่านปรับตามความยาวประโยค */\n  var PER_WORD = 550;       /* มิลลิวินาทีต่อคำ (ใช้เมื่อ AUTO) */\n  var GATE_MIN = 4000;      /* ขั้นต่ำ */\n  var GATE_MAX = 12000;     /* ขั้นสูง */\n  var GATE_MS = 3000;       /* ใช้เมื่อ AUTO = false (ใส่ 0 เพื่อปิดการหน่วง) */\n  var MODE = 'highlight';   /* 'highlight' = ไฮไลต์คำ | 'blank' = เจาะช่องว่าง */\n\n  var s = document.getElementById('example');\n  var w = document.getElementById('word-src');\n  var hint = document.getElementById('gate-hint');\n  var card = document.getElementById('card');\n\n  function esc2(t) {\n    return t.replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;');\n  }\n\n  /* 1) ไฮไลต์ (หรือเจาะช่อง) คำเป้าหมายในประโยค */\n  if (s && w) {\n    var word = (w.textContent || '').trim();\n    if (word) {\n      var esc = word.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n      var alts = [esc + '(?:s|es|ed|d|ing|ly)?'];\n      if (/e$/i.test(word)) alts.push(esc.slice(0, -1) + 'ing');\n      if (/y$/i.test(word)) alts.push(esc.slice(0, -1) + '(?:ies|ied)');\n      if (/[^aeiou][aeiou][bdgmnprt]$/i.test(word)) alts.push(esc + esc.slice(-1) + '(?:ed|ing|er)');\n      var pat = '\\\\b(?:' + alts.join('|') + ')\\\\b';\n      var reTest = new RegExp(pat, 'i');\n      var reAll = new RegExp(pat, 'gi');\n\n      var walker = document.createTreeWalker(s, NodeFilter.SHOW_TEXT, null, false);\n      var nodes = [], n;\n      while ((n = walker.nextNode())) nodes.push(n);\n      nodes.forEach(function (node) {\n        var text = node.nodeValue;\n        if (!reTest.test(text)) return;\n        var html = '', last = 0, m;\n        reAll.lastIndex = 0;\n        while ((m = reAll.exec(text)) !== null) {\n          html += esc2(text.slice(last, m.index));\n          html += (MODE === 'blank')\n            ? '<span class=\"blank\">_____<\/span>'\n            : '<span class=\"hl\">' + esc2(m[0]) + '<\/span>';\n          last = m.index + m[0].length;\n          if (m[0].length === 0) reAll.lastIndex++;\n        }\n        html += esc2(text.slice(last));\n        var span = document.createElement('span');\n        span.innerHTML = html;\n        node.parentNode.replaceChild(span, node);\n      });\n    }\n  }\n\n  /* 2) แตกประโยคเป็นคำ (รองรับไทย/อังกฤษ) */\n  var toks = [], wordCount = 0;\n  if (s) {\n    var seg = null;\n    try {\n      if (window.Intl && Intl.Segmenter) seg = new Intl.Segmenter(undefined, { granularity: 'word' });\n    } catch (e) { seg = null; }\n\n    var tw = document.createTreeWalker(s, NodeFilter.SHOW_TEXT, null, false);\n    var tn = [], x;\n    while ((x = tw.nextNode())) tn.push(x);\n\n    tn.forEach(function (node) {\n      var text = node.nodeValue;\n      if (!text.trim()) return;\n      var parts = [];\n      if (seg) {\n        Array.from(seg.segment(text)).forEach(function (p) { parts.push(p.segment); });\n      } else {\n        parts = text.split(/(\\s+)/);\n      }\n      var frag = document.createDocumentFragment();\n      parts.forEach(function (p) {\n        if (!p) return;\n        if (/^\\s+$/.test(p)) {\n          frag.appendChild(document.createTextNode(p));\n          return;\n        }\n        var t = document.createElement('span');\n        t.className = 'tk';\n        t.textContent = p;\n        frag.appendChild(t);\n        if (/[A-Za-z0-9À-ɏ฀-๿]/.test(p)) wordCount++;\n        toks.push({ el: t, idx: Math.max(wordCount - 1, 0) });\n      });\n      node.parentNode.replaceChild(frag, node);\n    });\n  }\n\n  /* 3) คำนวณเวลาบังคับอ่าน แล้วไล่สว่างทีละคำ */\n  var gateMs;\n  if (AUTO) {\n    gateMs = (s && wordCount)\n      ? Math.max(GATE_MIN, Math.min(GATE_MAX, wordCount * PER_WORD))\n      : GATE_MIN;\n  } else {\n    gateMs = GATE_MS;\n  }\n\n  if (s && wordCount && gateMs > 0) {\n    var step = Math.min((gateMs * 0.85) / wordCount, 800);\n    toks.forEach(function (t) { t.el.style.transitionDelay = (t.idx * step) + 'ms'; });\n    s.classList.add('sweep');\n    void s.offsetWidth;\n    setTimeout(function () { s.classList.add('on'); }, 30);\n    if (hint) hint.textContent = 'อ่านประโยคให้จบก่อน';\n  }\n\n  /* 4) วงแหวนหน่วงเวลา → พอครบเวลา การ์ดทั้งใบเปลี่ยนเป็นเขียวอ่อน */\n  var gate = document.getElementById('gate');\n  var ring = document.getElementById('gate-ring');\n  if (!gate) return;\n\n  function done() {\n    gate.classList.add('gate-done');\n    if (card) card.classList.add('ready');\n    if (hint) hint.textContent = '✓ พร้อมตอบ';\n    if (s) s.classList.add('on');\n  }\n\n  if (gateMs <= 0) { done(); return; }\n\n  if (ring) {\n    var C = 2 * Math.PI * 13;\n    ring.style.strokeDasharray = C;\n    ring.style.strokeDashoffset = C;\n    void ring.getBoundingClientRect();\n    ring.style.transition = 'stroke-dashoffset ' + gateMs + 'ms linear';\n    ring.style.strokeDashoffset = 0;\n  }\n  setTimeout(done, gateMs);\n})();\n<\/script>", "back": "<div class=\"ambient-wrapper\">\n  <div class=\"aurora-orb orb-1\"><\/div>\n  <div class=\"aurora-orb orb-2\"><\/div>\n\n  <div class=\"glass-masterpiece\">\n\n    {{#Image}}<div class=\"hero has-img\"><div class=\"hero-img\">{{Image}}<\/div>{{/Image}}{{^Image}}<div class=\"hero\">{{/Image}}\n      {{#Level}}<div class=\"level-badge lv-{{Level}}\">{{Level}}<\/div>{{/Level}}\n      {{#Image}}{{#ImageCredit}}<div class=\"img-credit\">{{ImageCredit}}<\/div>{{/ImageCredit}}{{/Image}}\n\n      <div class=\"word-header-block\">\n        <span class=\"word-title\">{{Word}}<\/span>\n        {{#POS}}<span class=\"word-pos\">{{POS}}<\/span>{{/POS}}\n        {{#IPA}}<span class=\"word-ipa\">/{{IPA}}/<\/span>{{/IPA}}\n      <\/div>\n    <\/div>\n\n    <div class=\"def-container\">\n      {{#Thai_Def}}\n      <div class=\"def-box thai-box\">\n        <div class=\"sub-label\">THAI DEFINITION<\/div>\n        <div class=\"def-text thai-text-accent\">{{Thai_Def}}<\/div>\n      <\/div>\n      {{/Thai_Def}}\n\n      {{#Memory_Hook}}\n      <div class=\"hook\" id=\"hook\">{{Memory_Hook}}<\/div>\n      {{/Memory_Hook}}\n\n      {{#Eng_Def}}\n      <div class=\"def-box eng-box\">\n        <div class=\"sub-label\">ENGLISH DEFINITION<\/div>\n        <div class=\"def-text\">{{Eng_Def}}<\/div>\n      <\/div>\n      {{/Eng_Def}}\n    <\/div>\n\n    {{#Example}}\n    <div class=\"example-box\">\n      <div class=\"sub-label\">ประโยคตัวอย่าง · EXAMPLE<\/div>\n      <div class=\"example-text\" id=\"example\">{{Example}}<\/div>\n    <\/div>\n    {{/Example}}\n\n    <div class=\"fam\" id=\"fam\">\n      {{#Synonyms}}\n      <div class=\"fam-row fam-syn\" data-kind=\"syn\">\n        <div class=\"fam-label\"><span class=\"fam-icon\">≈<\/span><span class=\"fam-th\">คำพ้อง<\/span><\/div>\n        <div class=\"fam-chips\">{{Synonyms}}<\/div>\n      <\/div>\n      {{/Synonyms}}\n\n      {{#Collocations}}\n      <div class=\"fam-row fam-col\" data-kind=\"col\">\n        <div class=\"fam-label\"><span class=\"fam-icon\">+<\/span><span class=\"fam-th\">ใช้คู่กับ<\/span><\/div>\n        <div class=\"fam-chips\">{{Collocations}}<\/div>\n      <\/div>\n      {{/Collocations}}\n\n      {{#Antonyms}}\n      <div class=\"fam-row fam-ant\" data-kind=\"ant\">\n        <div class=\"fam-label\"><span class=\"fam-icon\">↔<\/span><span class=\"fam-th\">ตรงข้าม<\/span><\/div>\n        <div class=\"fam-chips\">{{Antonyms}}<\/div>\n      <\/div>\n      {{/Antonyms}}\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n(function () {\n  /* ───── ตั้งค่า ───── */\n  var CAP = { syn: 3, col: 3, ant: 2 };   /* จำนวนชิปที่โชว์ก่อน ที่เหลือซ่อนใต้ปุ่ม +N */\n  var COLLAPSE_WHEN_HOOK = true;          /* true = การ์ดที่มี Memory_Hook พับกลุ่มคำที่เกี่ยวข้องไว้ใต้ปุ่มเดียว */\n\n  function esc2(t) {\n    return t.replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;');\n  }\n\n  /* 1) ไฮไลต์คำเป้าหมายในประโยคตัวอย่าง */\n  var s = document.getElementById('example');\n  var t0 = document.querySelector('.word-title');\n  if (s && t0) {\n    var word = (t0.textContent || '').trim();\n    if (word) {\n      var esc = word.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n      var alts = [esc + '(?:s|es|ed|d|ing|ly)?'];\n      if (/e$/i.test(word)) alts.push(esc.slice(0, -1) + 'ing');\n      if (/y$/i.test(word)) alts.push(esc.slice(0, -1) + '(?:ies|ied)');\n      if (/[^aeiou][aeiou][bdgmnprt]$/i.test(word)) alts.push(esc + esc.slice(-1) + '(?:ed|ing|er)');\n      var pat = '\\\\b(?:' + alts.join('|') + ')\\\\b';\n      var reTest = new RegExp(pat, 'i');\n      var reAll = new RegExp(pat, 'gi');\n\n      var walker = document.createTreeWalker(s, NodeFilter.SHOW_TEXT, null, false);\n      var nodes = [], n;\n      while ((n = walker.nextNode())) nodes.push(n);\n      nodes.forEach(function (node) {\n        var text = node.nodeValue;\n        if (!reTest.test(text)) return;\n        var html = '', last = 0, m;\n        reAll.lastIndex = 0;\n        while ((m = reAll.exec(text)) !== null) {\n          html += esc2(text.slice(last, m.index));\n          html += '<span class=\"hl\">' + esc2(m[0]) + '<\/span>';\n          last = m.index + m[0].length;\n          if (m[0].length === 0) reAll.lastIndex++;\n        }\n        html += esc2(text.slice(last));\n        var span = document.createElement('span');\n        span.innerHTML = html;\n        node.parentNode.replaceChild(span, node);\n      });\n    }\n  }\n\n  /* 2) Memory_Hook: ดึงเลขรอบ (① ② ③) ที่หัวข้อความ ไปเป็นตัวเล็กสีจางห้อยซ้าย\n        ที่เหลือแสดงตามที่เขียนไว้ ไม่แยกส่วน ไม่ใส่กรอบ\n        รองรับ hook รุ่นเก่าที่ขึ้นต้นด้วย <span>🔁 รอบ N<\/span> (แปลงเป็น ①②③ ให้) */\n  var hook = document.getElementById('hook');\n  if (hook) {\n    try {\n      var h = hook.innerHTML.trim();\n      h = h.replace(/^<span[^>]*>\\s*🔁\\s*รอบ\\s*([1-9])\\s*<\\/span>\\s*(?:<br\\s*\\/?>)?\\s*/i,\n        function (_, d) { return '①②③④⑤⑥⑦⑧⑨'.charAt(d - 1) + ' '; });\n      var mk = h.match(/^(?:&nbsp;|\\s)*([\\u2460-\\u2468])(?:&nbsp;|\\s|<br\\s*\\/?>)*/i);\n      if (mk) {\n        hook.innerHTML = '<span class=\"hk-n\">' + mk[1] + '<\/span>' + h.slice(mk[0].length);\n        hook.classList.add('has-n');\n      }\n    } catch (e) { /* ถ้าพลาด ปล่อยเป็นข้อความเดิม */ }\n  }\n\n  /* 3) แตกรายการคำเป็นชิป (คั่นด้วย , ; ， ； 、 | ขึ้นบรรทัดใหม่ หรือ \" / \") */\n  function splitList(raw) {\n    var tmp = document.createElement('div');\n    tmp.innerHTML = raw.replace(/<br\\s*\\/?>|<\\/(div|p|li)>/gi, ';');\n    var txt = (tmp.textContent || '').replace(/\\s+\\/\\s+/g, ';');\n    var out = [], buf = '', depth = 0, i, ch;\n    for (i = 0; i < txt.length; i++) {\n      ch = txt.charAt(i);\n      if (ch === '(' || ch === '（') depth++;\n      if (ch === ')' || ch === '）') depth = Math.max(0, depth - 1);\n      if (depth === 0 && /[,;，；、|\\n]/.test(ch)) {\n        if (buf.trim()) out.push(buf.trim());\n        buf = '';\n      } else {\n        buf += ch;\n      }\n    }\n    if (buf.trim()) out.push(buf.trim());\n    return out;\n  }\n\n  var total = 0;\n  var rowsEl = document.querySelectorAll('.fam-row');\n  Array.prototype.forEach.call(rowsEl, function (row) {\n    var el = row.querySelector('.fam-chips');\n    var items = el ? splitList(el.innerHTML) : [];\n    if (!items.length) { row.parentNode.removeChild(row); return; }\n    var cap = CAP[row.getAttribute('data-kind')] || 3;\n    total += items.length;\n    el.textContent = '';\n    items.forEach(function (it, i) {\n      var c = document.createElement('span');\n      c.className = 'chip' + (i >= cap ? ' chip-extra' : '');\n      c.textContent = it;\n      el.appendChild(c);\n    });\n    if (items.length > cap) {\n      var b = document.createElement('button');\n      b.type = 'button';\n      b.className = 'chip chip-more';\n      b.textContent = '+' + (items.length - cap);\n      b.addEventListener('click', function () { row.classList.add('open'); });\n      el.appendChild(b);\n    }\n  });\n\n  /* 4) จัดกลุ่มคำที่เกี่ยวข้อง: ว่างก็ลบทิ้ง / การ์ดที่มี Memory_Hook ให้พับไว้ใต้ปุ่มเดียว */\n  var fam = document.getElementById('f const LV=['A1','A2','B1','B2','C1','C2',''],lvn=l=>l||'ไม่ระบุ',LIFE=['ยังไม่เริ่ม','กำลังเรียน','เริ่มจำ','จำแม่น'],DOT=['--c1','--c2','--c3','--c4'];
const V=(D.vocab||[]).map(r=>({w:r[0],p:r[1],l:r[2],t:r[3],life:r[4],s:r[5],ivl:r[6]}));
const nk=s=>s.toLowerCase().replace(/[’‘`´]/g,"'").replace(/[^\p{L}\p{N}' ]+/gu,' ').replace(/\s+/g,' ').trim();
function keys(w){const o=new Set(),add=s=>{s=nk(s);if(s){o.add(s);o.add(s.replace(/^to /,''))}};
add(w);add(w.replace(/\([^)]*\)/g,' '));w.split(/\s*[\/,;]\s*/).forEach(add);o.delete('');return[...o]}
function st1(t){if(t.length<4)return t;let r=t;
if(/ies$/.test(r))r=r.slice(0,-3)+'y';else if(/(ss|us|is)$/.test(r)){}else if(/(sh|ch|x|z|s)es$/.test(r))r=r.slice(0,-2);else if(/s$/.test(r))r=r.slice(0,-1);
if(r.length>5&&/ing$/.test(r))r=r.slice(0,-3);else if(r.length>4&&/ied$/.test(r))r=r.slice(0,-3)+'y';else if(r.length>4&&/ed$/.test(r))r=r.slice(0,-2);
return r.replace(/e$/,'').replace(/([^aeiou'])\1$/,'$1')}
const stk=k=>k.split(' ').map(st1).join(' ');
const EX=new Map(),SX=new Map(),put=(m,k,e)=>{const a=m.get(k);a?a.push(e):m.set(k,[e])};
V.forEach(v=>{const ks=keys(v.w);ks.forEach(k=>put(EX,k,v));new Set(ks.map(stk)).forEach(k=>put(SX,k,v))});
function chk(ks){const seen=new Set(),pick=(m,f)=>{const o=[];ks.forEach(k=>(m.get(f(k))||[]).forEach(e=>{if(!seen.has(e)){seen.add(e);o.push(e)}}));return o};
const a=pick(EX,k=>k);if(a.length)return{k:'dup',ex:a};const b=pick(SX,stk);return b.length?{k:'sim',ex:b}:{k:'new',ex:[]}}
function parse(txt,sp){const out=[],bul=/^\s*(?:\d+\s*[.)、]|[-•*·▪●○►])\s*/;
txt.split(/\r?\n/).forEach(line=>{let s=line.replace(bul,'');const i=s.search(/[\u0E00-\u0E7F]/);if(i>=0)s=s.slice(0,i);
s=s.split(/\t|\s[-–—]\s|:\s/)[0];
(sp?s.split(/\s+/):s.split(/\s*[,;|•·、]\s*/)).forEach(x=>{x=x.replace(/\s*\((?:n|v|adj|adv|prep|conj|pron|phr|idiom|noun|verb|adjective|adverb)[^)]*\)\s*$/i,'').replace(/^["'“”‘’]+|["'“”‘’.:!?]+$/g,'').replace(/\s+/g,' ').trim();
if(x&&/\p{L}/u.test(x))out.push(x)})});return out}

function run(list){const qm=qidx(),seen=new Map(),ss=new Map();return list.map(w=>{const ks=keys(w),c=chk(ks),r={w,ex:c.ex};
if(c.k==='dup')r.k='dup';else if(ks.some(k=>qm.has(k)))r.k='inq';else if(ks.some(k=>seen.has(k))){r.k='bdup';r.of=seen.get(ks.find(k=>seen.has(k)))}
else if(c.k==='new'&&ks.some(k=>ss.has(stk(k)))){r.k='sim';r.of=ss.get(ks.map(stk).find(z=>ss.has(z)))}else r.k=c.k;
ks.forEach(k=>{if(!seen.has(k))seen.set(k,w);const z=stk(k);if(!ss.has(z))ss.set(z,w)});return r})}
function addQ(ws){const have=qidx();let n=0;ws.forEach(w=>{const ks=keys(w);if(!ks.some(k=>have.has(k))){Q.push({w,t:Date.now()});ks.forEach(k=>have.set(k,1));n++}});if(n)saveQ();return n}

<div id="vql"></div><div class="mu" style="margin-top:.6rem">คิวเก็บในเบราว์เซอร์ของเครื่อง/ที่อยู่เว็บนี้เท่านั้น (ไม่ซิงก์ข้ามอุปกรณ์) — อยากย้ายเครื่องให้กด ⬇ .txt แล้วกด ⬆ นำเข้าจาก .txt ที่เครื่องใหม่</div></div></div>`;
if(V.length){
document.getElementById('v').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.sv){vs.sub=d.sv;document.querySelectorAll('[data-sv]').forEach(x=>x.classList.toggle('on',x==b));document.getElementById('vl').classList.toggle('hide',d.sv!='l');document.getElementById('vq').classList.toggle('hide',d.sv!='q');return}
if(d.lv!==undefined){vs.lv=d.lv;vs.lim=300;vrender()}else if(d.st){vs.st=d.st;vs.lim=300;vrender()}else if(d.more){vs.lim+=300;vlist()}
else if(d.vcopy)copyT(vtext(false),b);else if(d.vdl)dl('vocab-'+(vs.lv||'ALL')+'-'+vs.st+'.txt',vtext(true));
else if(d.qf!==undefined){qs.f=d.qf;qrender()}
else if(d.save){const w=qs.res.filter(x=>x.k==='new'||(d.save==='sim'&&x.k==='sim')).map(x=>x.w),k=addQ(w);qs.msg=k?`บันทึกแล้ว ${k} คำ`:'ไม่มีคำใหม่ให้บันทึก';document.getElementById('vqt').value='';qcheck();qlist()}
else if(d.add){const x=qs.res[+d.add];if(x&&addQ([x.w])){qs.msg='บันทึก "'+x.w+'" แล้ว';qcheck();qlist()}}
else if(d.clr){document.getElementById('vqt').value='';qs.msg='';qcheck()}
else if(d.del){Q.splice(+d.del,1);saveQ();qlist();qcheck()}
else if(d.qcopy)copyT(qwords(d.qcopy==='1').join('\n'),b);
else if(d.qdl)dl('vocab-queue.txt',qwords(false).join('\n')+'\n');
else if(d.qclean){const before=Q.length;Q=Q.filter(i=>chk(keys(i.w)).k!=='dup');saveQ();qs.msg='ล้างออก '+(before-Q.length)+' คำ';qlist();qcheck()}
else if(d.qimp)document.getElementById('vqf').click();
else if(d.qall){if(Q.length&&confirm('ล้างคิวทั้งหมด '+Q.length+' คำ?')){Q=[];saveQ();qlist();qcheck()}}});
let tm;const vt=document.getElementById('vqt');vt.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{qs.msg='';qcheck()},120)});
vt.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();const k=addQ(qs.res.filter(x=>x.k==='new').map(x=>x.w));qs.msg=k?`บันทึกแล้ว ${k} คำ`:'ไม่มีคำใหม่ให้บันทึก';vt.value='';qcheck();qlist()}});
document.getElementById('vqs').addEventListener('change',qcheck);
document.getElementById('vqf').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{vt.value=(vt.value?vt.value+'\n':'')+r.result;qs.msg='นำเข้าจากไฟล์แล้ว — ตรวจผลด้านล่าง แล้วกดบันทึกคำใหม่';qcheck();e.target.value=''};r.readAsText(f,'utf-8')});
document.getElementById('vsq').addEventListener('input',e=>{vs.q=e.target.value;vs.lim=300;vlist()});
vrender();qlist();qrender()}

/* ===== หน้า "ส่งออก" (.txt แบบ Notes in Plain Text ของ Anki) ===== */
let CJ=null,xloading=false,xpend='',xf={st:'',q:''},xtm;
const XF=[['','ทั้งหมด',()=>true],['leech','ตัวถ่วง (ผิด ≥8)',r=>(r[7]||0)>=8],['susp','ระงับ',r=>r[6]],['new','ยังไม่เริ่ม',r=>r[5]==0],['learned','เรียนแล้ว',r=>r[5]>0],['mature','จำแม่น (≥21 วัน)',r=>r[5]==3]];
const qf=s=>/[\t\n\r"]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
function xtxt(mi,list){const m=CJ.models[mi],nf=m.f.length;
const head=['#separator:tab','#html:true','#guid column:1','#notetype column:2','#deck column:3','#tags column:'+(nf+4),'#columns:'+['GUID','Note Type','Deck',...m.f,'Tags'].join('\t')];
return head.join('\n')+'\n'+list.map(x=>{const f=x[4].slice(0,nf);while(f.length<nf)f.push('');return[x[0],m.n,CJ.decks[x[2]],...f,x[3]].map(qf).join('\t')}).join('\n')+'\n'}
const CRC=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0}return t})();
const crc32=b=>{let c=-1;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(~c)>>>0};
function zipBlob(files){const enc=new TextEncoder(),parts=[],cen=[],u16=v=>[v&255,v>>8&255],u32=v=>[v&255,v>>8&255,v>>16&255,v>>>24&255],t=new Date(),
tm=(t.getHours()<<11)|(t.getMinutes()<<5)|(t.getSeconds()>>1),dd=((t.getFullYear()-1980)<<9)|((t.getMonth()+1)<<5)|t.getDate();let off=0;
files.forEach(f=>{const nm=enc.encode(f.name),c=crc32(f.data),sz=f.data.length,
lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(tm),...u16(dd),...u32(c),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
parts.push(lh,nm,f.data);
cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(tm),...u16(dd),...u32(c),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
off+=lh.length+nm.length+sz});
const cl=cen.reduce((a,b)=>a+b.length,0);
return new Blob([...parts,...cen,new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cl),...u32(off),...u16(0)])],{type:'application/zip'})}
function xinit(){const el=document.getElementById('x');if(CJ||xloading)return;xloading=true;
el.innerHTML=`<div class="c"><h2>ส่งออกการ์ดเป็น .txt</h2><div class="mu">กำลังโหลดข้อมูลการ์ด…</div></div>`;
fetch(new URL('cards.json',location.href).href+'?v='+(D.stamp||D.generated)).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{CJ=j;xrender(xpend)})
.catch(()=>{xloading=false;el.innerHTML=`<div class="c"><h2>ส่งออกการ์ดเป็น .txt</h2><div class="mu">โหลด <code>cards.json</code> ไม่ได้ — ต้องเปิดผ่านเว็บ (หรือ <code>http://127.0.0.1:8766</code>) ไม่ใช่เปิดไฟล์ตรงๆ และต้องกด <b>🔄 อัปเดตข้อมูล</b> หนึ่งครั้งเพื่อสร้างไฟล์นี้</div></div>`})}
function xrender(x){const el=document.getElementById('x'),cnt={};CJ.notes.forEach(r=>cnt[r[2]]=(cnt[r[2]]||0)+1);
const R={};CJ.decks.forEach((nm,i)=>{const p=nm.split('::');for(let k=1;k<=p.length;k++){const a=p.slice(0,k).join('::');R[a]=(R[a]||0)+(cnt[i]||0)}});
const names=Object.keys(R).sort((a,b)=>a.localeCompare(b,'th'));
el.innerHTML=`<div class="c"><h2>ส่งออกการ์ดเป็น .txt</h2><div class="mu">ได้ครบทุกใบ ทุกฟิลด์ พร้อม GUID · แท็ก · ชื่อเด็ค ในรูปแบบ <b>Notes in Plain Text</b> ของ Anki — นำเข้ากลับ (File → Import) แล้วจะอัปเดตโน้ตเดิมตาม GUID ได้ และส่งให้ AI อ่านเพื่อปรับปรุงการ์ดได้ · 1 ไฟล์ต่อ 1 โน้ตไทป์ เพราะแต่ละไทป์ฟิลด์ไม่เท่ากัน</div>
<select id="xs"><option value="">ทุกเด็ค · ${n(CJ.notes.length)} โน้ต</option>${names.map(s=>`<option value="${esc(s)}">${'\u00a0\u00a0'.repeat(s.split('::').length-1)}${esc(s.split('::').pop())} · ${n(R[s])}</option>`).join('')}</select>
<div class="chips" id="xc"></div><input id="xq" placeholder="กรองด้วยข้อความในการ์ด (ไม่บังคับ)…" style="max-width:420px"><div id="xp"></div></div>`;
document.getElementById('xc').onclick=e=>{const b=e.target.closest('button');if(b){xf.st=b.dataset.xf;xfiles()}};
document.getElementById('xq').oninput=e=>{clearTimeout(xtm);const v=e.target.value.trim().toLowerCase();xtm=setTimeout(()=>{xf.q=v;xfiles()},200)};
const sel=document.getElementById('xs');sel.onchange=xfiles;if(x&&R[x])sel.value=x;xfiles()}
function xfiles(){const s=document.getElementById('xs').value,by={};
const ff=XF.find(f=>f[0]===xf.st);
CJ.notes.forEach(r=>{const d=CJ.decks[r[2]];if((!s||d===s||d.startsWith(s+'::'))&&ff[2](r)&&(!xf.q||r[4].join(' ').toLowerCase().includes(xf.q)))(by[r[1]]||(by[r[1]]=[])).push(r)});
const ids=Object.keys(by).sort((a,b)=>by[b].length-by[a].length),sfx=(xf.st?' ['+ff[1]+']':'')+(xf.q?' [กรอง]':''),file=i=>fname(s)+' - '+fname(CJ.models[i].n)+sfx+'.txt';
document.getElementById('xc').innerHTML=XF.map(f=>`<button class="chip ${xf.st===f[0]?'on':''}" data-xf="${f[0]}">${f[1]}</button>`).join('');
document.getElementById('xp').innerHTML=ids.length?ids.map(i=>`<div class="row" style="padding:.45rem 0;border-bottom:1px solid var(--bd)"><div><b>${esc(CJ.models[i].n)}</b> <span class="mu">· ${n(by[i].length)} โน้ต · ${CJ.models[i].f.length} ฟิลด์</span></div><div><button class="cp ac" data-xd="${i}">⬇ .txt</button> <button class="cp" data-xc="${i}">คัดลอก</button></div></div>`).join('')
+(ids.length>1?`<p><button class="cp" data-xz="1">⬇ ทุกไฟล์รวมเป็น .zip (${ids.length} ไฟล์)</button></p>`:''):'<div class="mu">ไม่มีโน้ตที่ตรงเงื่อนไข</div>';
document.getElementById('xp').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.xd!==undefined)dl(file(d.xd),xtxt(+d.xd,by[d.xd]));else if(d.xc!==undefined)copyT(xtxt(+d.xc,by[d.xc]),b);
else if(d.xz){const enc=new TextEncoder();dl(fname(s)+sfx+'.zip',zipBlob(ids.map(i=>({name:file(i),data:enc.encode(xtxt(+i,by[i]))}))))}}}

function xgo(name){xpend=name;go('x');if(CJ){const sel=document.getElementById('xs');sel.value=name;xfiles()}}
const API='http://127.0.0.1:8766',up=document.getElementById('up'),st=document.getElementById('st');
fetch(API+'/ping').then(r=>r.ok&&up.classList.remove('hide')).catch(()=>{});
up.onclick=async()=>{up.disabled=true;st.textContent='กำลังอัปเดต… (อาจใช้เวลาครึ่งนาที)';
try{const r=await fetch(API+'/update',{method:'POST'}),j=await r.json();st.textContent=(j.ok?'✅ ':'❌ ')+j.msg}catch(e){st.textContent='❌ เชื่อมต่อตัวช่วยไม่ได้'}up.disabled=false};
</script></body></html>
